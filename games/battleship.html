<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naval Warfare P2P</title>
    <!-- PeerJS for WebRTC -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-main: #0b1120;
            --panel-bg: #151d30;
            --border: #23314d;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --danger: #ef4444;
            --success: #22c55e;
            --water-cell: #1a243b;
            --ship: #475569;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        header {
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
        }

        .title {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .home-btn {
            background-color: var(--panel-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }
        .home-btn:hover { background-color: var(--border); border-color: var(--accent); }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px 20px;
            width: 100%;
            max-width: 950px;
            margin-bottom: 15px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .lobby-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="text"] {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 8px;
            flex: 1;
            min-width: 220px;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent); }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-glow); }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: #16a34a; }
        .btn-secondary { background-color: #334155; }
        .btn-secondary:hover { background-color: #475569; }

        .status-bar {
            margin-top: 10px;
            font-weight: 600;
            font-size: 1rem;
            color: var(--accent);
        }

        .game-layout {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 950px;
        }

        .board-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .board-header {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            color: var(--text-muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(10, 32px);
            grid-template-rows: repeat(10, 32px);
            gap: 3px;
            background-color: var(--border);
            padding: 4px;
            border-radius: 8px;
            position: relative;
        }

        .cell {
            background-color: var(--water-cell);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.15s, transform 0.1s;
        }

        .cell:hover:not(.disabled) {
            background-color: #334155;
            transform: scale(1.05);
        }

        .cell.ship { background-color: var(--ship); border: 1px solid #94a3b8; }
        .cell.hit {
            background-color: var(--danger) !important;
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cell.hit::after { content: "💥"; font-size: 16px; }
        .cell.miss { background-color: #1e293b; }
        .cell.miss::after { content: "•"; color: #64748b; font-size: 24px; }
        .cell.disabled { cursor: not-allowed; }

        .controls {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .ship-tracker {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .ship-badge {
            background: #1e293b;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .ship-badge.sunk { background: #450a0a; color: #fca5a5; border-color: #991b1b; text-decoration: line-through; }

        .chat-bar {
            display: flex;
            gap: 6px;
            justify-content: center;
            width: 100%;
            margin-top: 10px;
            background: var(--panel-bg);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .chat-btn {
            background: #1e293b;
            border: 1px solid var(--border);
            font-size: 1.2rem;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        .chat-btn:hover { transform: scale(1.15); background: #334155; }

        .floating-emoji {
            position: fixed;
            font-size: 3rem;
            pointer-events: none;
            animation: floatUp 2s ease-out forwards;
            z-index: 999;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { transform: translateY(-80px) scale(1.3); }
            100% { opacity: 0; transform: translateY(-150px) scale(1); }
        }

        @keyframes pop {
            0% { transform: scale(0.5); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .shake { animation: shakeAnim 0.4s ease-in-out; }
        @keyframes shakeAnim {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-6px, 4px); }
            40% { transform: translate(6px, -4px); }
            60% { transform: translate(-4px, -2px); }
            80% { transform: translate(4px, 2px); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="title">⚡ NAVAL WARFARE P2P</div>
        <a href="https://supernebula23.github.io/games" class="home-btn">🏠 Home</a>
    </header>

    <div class="panel">
        <div id="lobby" class="lobby-row">
            <button id="host-btn" class="btn" onclick="hostGame()">🎮 Create Room</button>
            <span style="color: var(--text-muted)">or</span>
            <input type="text" id="join-id" placeholder="Paste Host ID or Invite Link here...">
            <button class="btn btn-secondary" onclick="joinGame()">Join Room</button>
        </div>
        
        <div id="share-area" class="hidden" style="margin-top: 10px;">
            <p style="margin: 0 0 6px 0; font-size: 0.9rem; color: var(--text-muted);">Send this invite link to your opponent:</p>
            <div class="lobby-row">
                <input type="text" id="share-url" readonly>
                <button class="btn" onclick="copyLink()">📋 Copy Link</button>
            </div>
        </div>

        <div id="status" class="status-bar">💡 Create a room or join one to begin!</div>
    </div>

    <div id="game-area" class="game-layout hidden">
        <div class="board-card">
            <div class="board-header">
                <span>YOUR FLEET</span>
                <span id="placement-info">Place: Carrier (5)</span>
            </div>
            <div id="my-board" class="grid"></div>
            
            <div class="controls">
                <button id="rotate-btn" class="btn btn-secondary" onclick="toggleOrientation()">🔄 Rotate: <span id="orient-label">Horiz</span></button>
                <button id="rand-btn" class="btn btn-secondary" onclick="randomizeShips()">🎲 Randomize</button>
                <button id="ready-btn" class="btn btn-success hidden" onclick="confirmReady()">🚀 Ready for Battle</button>
            </div>

            <div class="ship-tracker" id="my-ship-tracker"></div>
        </div>

        <div class="board-card">
            <div class="board-header">
                <span>ENEMY WATERS</span>
                <span>Targets</span>
            </div>
            <div id="enemy-board" class="grid"></div>
            <div class="ship-tracker" id="enemy-ship-tracker"></div>
        </div>

        <div class="chat-bar">
            <button class="chat-btn" onclick="sendEmoji('🎯')">🎯</button>
            <button class="chat-btn" onclick="sendEmoji('💥')">💥</button>
            <button class="chat-btn" onclick="sendEmoji('🔥')">🔥</button>
            <button class="chat-btn" onclick="sendEmoji('😂')">😂</button>
            <button class="chat-btn" onclick="sendEmoji('💀')">💀</button>
            <button class="chat-btn" onclick="sendEmoji('💩')">💩</button>
            <button class="btn btn-secondary" style="padding:4px 10px; font-size:0.8rem;" onclick="sendEmoji('Nice shot!')">"Nice shot!"</button>
            <button class="btn btn-secondary" style="padding:4px 10px; font-size:0.8rem;" onclick="sendEmoji('GG!')">"GG!"</button>
        </div>
    </div>

    <script>
        const AudioFX = {
            ctx: null,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            playShoot() {
                this.init();
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(500, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.15);
            },
            playHit() {
                this.init();
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.3);
            },
            playMiss() {
                this.init();
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(150, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);
            }
        };

        const BOARD_SIZE = 10;
        const SHIPS_DEF = [
            { id: 'carrier', name: 'Carrier', size: 5 },
            { id: 'battleship', name: 'Battleship', size: 4 },
            { id: 'cruiser', name: 'Cruiser', size: 3 },
            { id: 'submarine', name: 'Submarine', size: 3 },
            { id: 'destroyer', name: 'Destroyer', size: 2 }
        ];

        let peer = null, conn = null;
        let myBoardState = Array(10).fill(null).map(() => Array(10).fill(null));
        let enemyBoardState = Array(10).fill(null).map(() => Array(10).fill(0));
        let myPlacedShips = [];
        let enemyShipsStatus = SHIPS_DEF.map(s => ({ ...s, sunk: false }));

        let currentShipIdx = 0;
        let isHorizontal = true;
        let myReady = false, enemyReady = false;
        let myTurn = false, gameStarted = false;

        const myBoardEl = document.getElementById('my-board');
        const enemyBoardEl = document.getElementById('enemy-board');
        const statusEl = document.getElementById('status');

        function initGrids() {
            myBoardEl.innerHTML = ''; enemyBoardEl.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cellM = document.createElement('div');
                    cellM.className = 'cell';
                    cellM.dataset.r = r; cellM.dataset.c = c;
                    cellM.addEventListener('mouseenter', handleHover);
                    cellM.addEventListener('mouseleave', clearHover);
                    cellM.addEventListener('click', handlePlace);
                    myBoardEl.appendChild(cellM);

                    const cellE = document.createElement('div');
                    cellE.className = 'cell disabled';
                    cellE.dataset.r = r; cellE.dataset.c = c;
                    cellE.addEventListener('click', () => attackCell(r, c));
                    enemyBoardEl.appendChild(cellE);
                }
            }
            renderTrackers();
        }

        function renderTrackers() {
            document.getElementById('my-ship-tracker').innerHTML = SHIPS_DEF.map(s => {
                const placed = myPlacedShips.find(p => p.id === s.id);
                const isSunk = placed && placed.hits === s.size;
                return `<div class="ship-badge ${isSunk ? 'sunk' : ''}">${s.name}</div>`;
            }).join('');

            document.getElementById('enemy-ship-tracker').innerHTML = enemyShipsStatus.map(s => 
                `<div class="ship-badge ${s.sunk ? 'sunk' : ''}">${s.name}</div>`
            ).join('');
        }

        function hostGame() {
            document.getElementById('lobby').classList.add('hidden');
            peer = new Peer();
            peer.on('open', id => {
                const url = new URL(window.location.href);
                url.searchParams.set('join', id);
                document.getElementById('share-url').value = url.href;
                document.getElementById('share-area').classList.remove('hidden');
                updateStatus('Waiting for an opponent to join...');
            });
            peer.on('connection', c => { conn = c; bindEvents(); });
        }

        function joinGame() {
            let val = document.getElementById('join-id').value.trim();
            if (!val) return;
            if (val.includes('join=')) val = new URLSearchParams(val.split('?')[1]).get('join');
            document.getElementById('lobby').classList.add('hidden');
            updateStatus('Connecting to Host...');
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(val);
                bindEvents();
            });
        }

        function bindEvents() {
            conn.on('open', () => {
                document.getElementById('share-area').classList.add('hidden');
                document.getElementById('game-area').classList.remove('hidden');
                initGrids();
                updateStatus('Connected! Position your fleet.');
            });
            conn.on('data', handleData);
            conn.on('close', () => { alert('Opponent disconnected.'); location.reload(); });
        }

        function copyLink() {
            const el = document.getElementById('share-url');
            el.select(); navigator.clipboard.writeText(el.value);
            updateStatus('Link copied to clipboard!');
        }

        function toggleOrientation() {
            isHorizontal = !isHorizontal;
            document.getElementById('orient-label').innerText = isHorizontal ? 'Horiz' : 'Vert';
        }

        function canPlace(r, c, size, horiz) {
            if (horiz && c + size > 10) return false;
            if (!horiz && r + size > 10) return false;
            for (let i = 0; i < size; i++) {
                if (myBoardState[horiz ? r : r + i][horiz ? c + i : c]) return false;
            }
            return true;
        }

        function handleHover(e) {
            if (myReady || currentShipIdx >= SHIPS_DEF.length) return;
            const r = +e.target.dataset.r, c = +e.target.dataset.c, size = SHIPS_DEF[currentShipIdx].size;
            if (canPlace(r, c, size, isHorizontal)) {
                for (let i = 0; i < size; i++) {
                    const el = getCell(myBoardEl, isHorizontal ? r : r + i, isHorizontal ? c + i : c);
                    if (el) el.style.backgroundColor = '#38bdf8';
                }
            }
        }

        function clearHover() {
            if (myReady) return;
            document.querySelectorAll('#my-board .cell').forEach(cell => {
                const r = cell.dataset.r, c = cell.dataset.c;
                if (!myBoardState[r][c]) cell.style.backgroundColor = '';
            });
        }

        function handlePlace(e) {
            if (myReady || currentShipIdx >= SHIPS_DEF.length) return;
            const r = +e.target.dataset.r, c = +e.target.dataset.c, def = SHIPS_DEF[currentShipIdx];
            if (canPlace(r, c, def.size, isHorizontal)) {
                const coords = [];
                for (let i = 0; i < def.size; i++) {
                    const cr = isHorizontal ? r : r + i, cc = isHorizontal ? c + i : c;
                    myBoardState[cr][cc] = def.id;
                    coords.push({ r: cr, c: cc });
                    getCell(myBoardEl, cr, cc).classList.add('ship');
                }
                myPlacedShips.push({ ...def, coordinates: coords, hits: 0 });
                currentShipIdx++;
                
                if (currentShipIdx < SHIPS_DEF.length) {
                    document.getElementById('placement-info').innerText = `Place: ${SHIPS_DEF[currentShipIdx].name} (${SHIPS_DEF[currentShipIdx].size})`;
                } else {
                    document.getElementById('placement-info').innerText = 'Fleet Ready!';
                    showReadyButton();
                }
                renderTrackers();
            }
        }

        function randomizeShips() {
            myBoardState = Array(10).fill(null).map(() => Array(10).fill(null));
            myPlacedShips = [];
            currentShipIdx = 0;
            document.querySelectorAll('#my-board .cell').forEach(c => c.className = 'cell');

            SHIPS_DEF.forEach(def => {
                let placed = false;
                while (!placed) {
                    const horiz = Math.random() < 0.5;
                    const r = Math.floor(Math.random() * 10);
                    const c = Math.floor(Math.random() * 10);
                    if (canPlace(r, c, def.size, horiz)) {
                        const coords = [];
                        for (let i = 0; i < def.size; i++) {
                            const cr = horiz ? r : r + i, cc = horiz ? c + i : c;
                            myBoardState[cr][cc] = def.id;
                            coords.push({ r: cr, c: cc });
                            getCell(myBoardEl, cr, cc).classList.add('ship');
                        }
                        myPlacedShips.push({ ...def, coordinates: coords, hits: 0 });
                        placed = true;
                    }
                }
            });
            currentShipIdx = SHIPS_DEF.length;
            document.getElementById('placement-info').innerText = 'Fleet Ready!';
            renderTrackers();
            showReadyButton();
        }

        function showReadyButton() {
            document.getElementById('rotate-btn').classList.add('hidden');
            document.getElementById('rand-btn').classList.add('hidden');
            document.getElementById('ready-btn').classList.remove('hidden');
            updateStatus('Fleet configured! Click "Ready for Battle".');
        }

        function confirmReady() {
            myReady = true;
            document.getElementById('ready-btn').classList.add('hidden');
            conn.send({ type: 'READY' });
            if (enemyReady) startBattle();
            else updateStatus('Waiting for opponent to get ready...');
        }

        function startBattle() {
            gameStarted = true;
            myTurn = peer.id < conn.peer;
            updateTurn();
        }

        function attackCell(r, c) {
            if (!myTurn || !gameStarted || enemyBoardState[r][c] !== 0) return;
            AudioFX.playShoot();
            enemyBoardState[r][c] = 1;
            conn.send({ type: 'ATTACK', r, c });
            myTurn = false;
            updateTurn();
        }

        function handleData(data) {
            if (data.type === 'READY') {
                enemyReady = true;
                if (myReady && !gameStarted) startBattle();
                else updateStatus('Opponent is ready! Complete your setup.');
            }
            else if (data.type === 'ATTACK') {
                const shipId = myBoardState[data.r][data.c];
                const hit = !!shipId;
                const cell = getCell(myBoardEl, data.r, data.c);
                let sunkShipName = null;

                if (hit) {
                    AudioFX.playHit();
                    document.body.classList.add('shake');
                    setTimeout(() => document.body.classList.remove('shake'), 400);
                    cell.classList.add('hit');
                    const ship = myPlacedShips.find(s => s.id === shipId);
                    ship.hits++;
                    if (ship.hits === ship.size) sunkShipName = ship.name;
                } else {
                    AudioFX.playMiss();
                    cell.classList.add('miss');
                }

                const allSunk = myPlacedShips.every(s => s.hits === s.size);
                conn.send({ type: 'ATTACK_REPLY', r: data.r, c: data.c, hit, sunkShipName, gameOver: allSunk });

                if (allSunk) {
                    updateStatus('💥 DEFEAT! All your ships were destroyed.');
                    gameStarted = false;
                } else {
                    myTurn = true;
                    updateTurn();
                }
                renderTrackers();
            }
            else if (data.type === 'ATTACK_REPLY') {
                const cell = getCell(enemyBoardEl, data.r, data.c);
                enemyBoardState[data.r][data.c] = data.hit ? 2 : 3;

                if (data.hit) {
                    AudioFX.playHit();
                    cell.classList.add('hit');
                    if (data.sunkShipName) {
                        const target = enemyShipsStatus.find(s => s.name === data.sunkShipName);
                        if (target) target.sunk = true;
                        updateStatus(`🎯 BOOM! You sunk their ${data.sunkShipName}!`);
                    }
                } else {
                    AudioFX.playMiss();
                    cell.classList.add('miss');
                }

                renderTrackers();

                if (data.gameOver) {
                    updateStatus('🏆 VICTORY! You destroyed the enemy fleet!');
                    gameStarted = false;
                } else if (!data.sunkShipName) {
                    updateTurn();
                }
            }
            else if (data.type === 'EMOJI') {
                spawnEmoji(data.emoji, false);
            }
        }

        function updateTurn() {
            if (!gameStarted) return;
            document.querySelectorAll('#enemy-board .cell').forEach(cell => {
                const r = cell.dataset.r, c = cell.dataset.c;
                if (myTurn && enemyBoardState[r][c] === 0) cell.classList.remove('disabled');
                else cell.classList.add('disabled');
            });
            updateStatus(myTurn ? '🎯 YOUR TURN! Take your shot.' : '⏳ OPPONENT TURN! Stand by...');
        }

        function sendEmoji(emoji) {
            if (conn) conn.send({ type: 'EMOJI', emoji });
            spawnEmoji(emoji, true);
        }

        function spawnEmoji(emoji, isSelf) {
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.innerText = emoji;
            el.style.left = (isSelf ? 30 : 70) + (Math.random() * 10 - 5) + 'vw';
            el.style.top = '70vh';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }

        function updateStatus(msg) { statusEl.innerHTML = '⚡ ' + msg; }
        function getCell(boardEl, r, c) { return boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`); }

        window.addEventListener('load', () => {
            const join = new URLSearchParams(window.location.search).get('join');
            if (join) {
                document.getElementById('join-id').value = join;
                joinGame();
            }
        });
    </script>
</body>
</html>
