<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Match Showdown</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      margin: 0;
      background: #121218;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e1e28;
      border: 2px solid #2d2d3d;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 { margin-top: 0; color: #ff0055; text-transform: uppercase; letter-spacing: 1px; }
    .room-setup { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
    input[type="text"] {
      padding: 10px; background: #2a2a38; border: 1px solid #3d3d52; color: #fff; border-radius: 6px; flex: 1;
    }
    button {
      padding: 10px 20px; background: #ff0055; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer;
    }
    button:hover { background: #e0004c; }
    button:disabled { background: #555; cursor: not-allowed; }
    
    #color-display {
      width: 100%; height: 120px; border-radius: 8px; border: 3px solid #3d3d52;
      margin: 15px 0; display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    
    .sliders { display: flex; flex-direction: column; gap: 10px; margin: 15px 0; }
    .slider-group { display: flex; align-items: center; gap: 10px; }
    .slider-group label { width: 20px; font-weight: bold; }
    input[type="range"] { flex: 1; accent-color: #ff0055; }

    .scores { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; }
    .p1-color { color: #00d2d3; } .p2-color { color: #ff9f43; }
    
    #round-info { font-size: 18px; font-weight: bold; color: #ffd700; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Color Match</h1>
    
    <div class="scores">
      <span class="p1-color">P1 Score: <span id="p1-score">0</span></span>
      <span id="round-info">Round 1/3</span>
      <span class="p2-color">P2 Score: <span id="p2-score">0</span></span>
    </div>

    <div class="room-setup">
      <input type="text" id="join-id" placeholder="Paste Host Room ID">
      <button onclick="joinRoom()">Join Game</button>
    </div>
    <p id="status">Room ID: <b id="my-id" style="color:#00d2d3">Generating...</b></p>
    <button id="start-btn" onclick="startRound()" disabled>Start Game</button>

    <div id="color-display" style="background-color: #2a2a38;">Waiting for Game...</div>

    <!-- Color Mixing Controls -->
    <div class="sliders">
      <div class="slider-group">
        <label style="color:#ff4757">R</label>
        <input type="range" id="r-slider" min="0" max="255" value="128" oninput="updateMixColor()">
      </div>
      <div class="slider-group">
        <label style="color:#2ed573">G</label>
        <input type="range" id="g-slider" min="0" max="255" value="128" oninput="updateMixColor()">
      </div>
      <div class="slider-group">
        <label style="color:#1e90ff">B</label>
        <input type="range" id="b-slider" min="0" max="255" value="128" oninput="updateMixColor()">
      </div>
    </div>

    <button id="lock-btn" onclick="lockInGuess()" disabled>Lock In Guess!</button>
  </div>

  <script>
    let peer = new Peer();
    let conn = null;
    let isHost = false;

    // Game state
    let round = 1;
    let p1Score = 0;
    let p2Score = 0;
    let targetColor = { r: 0, g: 0, b: 0 };
    let myGuess = null;
    let peerGuess = null;
    let isGuessingPhase = false;

    // 1. PeerJS Connection Setup
    peer.on('open', (id) => {
      document.getElementById('my-id').innerText = id;
    });

    peer.on('connection', (connection) => {
      conn = connection;
      isHost = true;
      setupEvents();
      document.getElementById('status').innerText = "Status: Player 2 Connected!";
      document.getElementById('start-btn').disabled = false;
    });

    function joinRoom() {
      const hostId = document.getElementById('join-id').value.trim();
      if (!hostId) return;
      conn = peer.connect(hostId);
      isHost = false;
      setupEvents();
      document.getElementById('status').innerText = "Status: Connected to Host!";
    }

    function setupEvents() {
      conn.on('data', (data) => {
        if (data.type === 'START_ROUND') {
          handleRoundStart(data.color, data.round);
        } else if (data.type === 'SUBMIT_GUESS') {
          peerGuess = data.guess;
          checkRoundEnd();
        } else if (data.type === 'ROUND_RESULTS') {
          showResults(data);
        }
      });
    }

    // 2. Mix Preview Logic
    function updateMixColor() {
      if (!isGuessingPhase) return;
      const r = document.getElementById('r-slider').value;
      const g = document.getElementById('g-slider').value;
      const b = document.getElementById('b-slider').value;
      document.getElementById('color-display').style.backgroundColor = `rgb(${r},${g},${b})`;
    }

    // 3. Round Logic
    function startRound() {
      if (!isHost) return;
      targetColor = {
        r: Math.floor(Math.random() * 256),
        g: Math.floor(Math.random() * 256),
        b: Math.floor(Math.random() * 256)
      };
      
      conn.send({ type: 'START_ROUND', color: targetColor, round: round });
      handleRoundStart(targetColor, round);
    }

    function handleRoundStart(color, currentRound) {
      round = currentRound;
      targetColor = color;
      myGuess = null;
      peerGuess = null;
      isGuessingPhase = false;

      document.getElementById('round-info').innerText = `Round ${round}/3`;
      document.getElementById('lock-btn').disabled = true;
      document.getElementById('start-btn').disabled = true;

      // Show target color for 2 seconds
      const display = document.getElementById('color-display');
      display.style.backgroundColor = `rgb(${color.r}, ${color.g}, ${color.b})`;
      display.innerText = "MEMORIZE!";

      setTimeout(() => {
        // Hide color
        display.style.backgroundColor = "rgb(128,128,128)";
        display.innerText = "Match the Color!";
        
        // Reset Sliders
        document.getElementById('r-slider').value = 128;
        document.getElementById('g-slider').value = 128;
        document.getElementById('b-slider').value = 128;
        
        isGuessingPhase = true;
        updateMixColor();
        document.getElementById('lock-btn').disabled = false;
      }, 2000);
    }

    function lockInGuess() {
      const r = parseInt(document.getElementById('r-slider').value);
      const g = parseInt(document.getElementById('g-slider').value);
      const b = parseInt(document.getElementById('b-slider').value);
      
      myGuess = { r, g, b };
      isGuessingPhase = false;
      document.getElementById('lock-btn').disabled = true;
      document.getElementById('color-display').innerText = "Locked In! Waiting for other player...";

      conn.send({ type: 'SUBMIT_GUESS', guess: myGuess });
      checkRoundEnd();
    }

    function checkRoundEnd() {
      if (myGuess && peerGuess && isHost) {
        // Calculate points based on distance from target RGB
        let hostGuess = myGuess;
        let clientGuess = peerGuess;

        let hostDiff = Math.hypot(targetColor.r - hostGuess.r, targetColor.g - hostGuess.g, targetColor.b - hostGuess.b);
        let clientDiff = Math.hypot(targetColor.r - clientGuess.r, targetColor.g - clientGuess.g, targetColor.b - clientGuess.b);

        // Convert difference into accuracy percentage
        let maxDiff = Math.hypot(255, 255, 255);
        let hostAcc = Math.max(0, Math.round((1 - hostDiff / maxDiff) * 100));
        let clientAcc = Math.max(0, Math.round((1 - clientDiff / maxDiff) * 100));

        p1Score += hostAcc;
        p2Score += clientAcc;

        const results = {
          type: 'ROUND_RESULTS',
          target: targetColor,
          p1Guess: hostGuess,
          p2Guess: clientGuess,
          p1Acc: hostAcc,
          p2Acc: clientAcc,
          p1Total: p1Score,
          p2Total: p2Score
        };

        conn.send(results);
        showResults(results);
      }
    }

    function showResults(data) {
      document.getElementById('p1-score').innerText = data.p1Total;
      document.getElementById('p2-score').innerText = data.p2Total;

      const display = document.getElementById('color-display');
      display.style.backgroundColor = `rgb(${data.target.r}, ${data.target.g}, ${data.target.b})`;

      let p1Acc = isHost ? data.p1Acc : data.p2Acc;
      let p2Acc = isHost ? data.p2Acc : data.p1Acc;

      display.innerText = `You: ${p1Acc}% | Opponent: ${p2Acc}%`;

      if (round < 3) {
        round++;
        if (isHost) {
          setTimeout(startRound, 4000); // 4 sec pause before next round
        }
      } else {
        // Final Winner Announcement
        setTimeout(() => {
          let winnerText = "";
          if (data.p1Total > data.p2Total) winnerText = isHost ? "YOU WIN THE GAME! 🎉" : "OPPONENT WINS!";
          else if (data.p2Total > data.p1Total) winnerText = isHost ? "OPPONENT WINS!" : "YOU WIN THE GAME! 🎉";
          else winnerText = "IT'S A TIE!";
          
          display.innerText = winnerText;
          if (isHost) document.getElementById('start-btn').disabled = false;
        }, 3000);
      }
    }
  </script>
</body>
</html>
