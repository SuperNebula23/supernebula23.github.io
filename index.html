<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperNebula23 🌌</title>
    <!-- Twemoji Script -->
    <script src="https://unpkg.com/twemoji@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --text-primary: #0f172a;
            --pink-floyd-spectrum: linear-gradient(
                90deg, 
                #ff0000 0%, 
                #ff7f00 16.6%, 
                #ffff00 33.3%, 
                #00ff00 50%, 
                #0000ff 66.6%, 
                #4b0082 83.3%, 
                #9400d3 100%
            );
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Cosmic Background Elements */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #e0e7ff;
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #fae8ff;
            bottom: -150px;
            right: -100px;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 40px) scale(1.1); }
        }

        /* Pink Floyd Triangulation & Prism Container */
        .prism-container {
            position: relative;
            width: 280px;
            height: 230px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
        }

        .prism-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.05));
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .prism-container:hover .prism-svg {
            transform: scale(1.05) rotate(2deg);
        }

        /* Twemoji Styling & Placement */
        .emoji-core {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -40%);
            animation: pulse-space 4s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Target Twemoji parsed SVG image */
        .emoji-core img.emoji {
            width: 3.5rem;
            height: 3.5rem;
            pointer-events: none;
        }

        @keyframes pulse-space {
            0%, 100% { transform: translate(-50%, -40%) scale(1); filter: drop-shadow(0 0 0px rgba(0,0,0,0)); }
            50% { transform: translate(-50%, -40%) scale(1.15); filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.4)); }
        }

        /* Spectrum Beams */
        .light-ray-in {
            stroke: #94a3b8;
            stroke-dasharray: 8;
            animation: ray-dash 30s linear infinite;
        }

        .spectrum-beam {
            opacity: 0.85;
            transition: opacity 0.3s;
        }

        .prism-container:hover .spectrum-beam {
            opacity: 1;
            filter: drop-shadow(0 0 8px rgba(236, 72, 153, 0.3));
        }

        /* Title */
        .title {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, #0f172a 0%, #4338ca 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        /* Prism Divider Line */
        .spectrum-bar {
            width: 240px;
            height: 3px;
            background: var(--pink-floyd-spectrum);
            border-radius: 3px;
            margin-top: 1.5rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- Pink Floyd Prism Visual -->
    <div class="prism-container">
        <svg class="prism-svg" viewBox="0 0 300 240" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Incoming Light Beam -->
            <line x1="0" y1="170" x2="115" y2="120" stroke="#cbd5e1" stroke-width="2.5" class="light-ray-in" />
            
            <!-- Prism Triangle -->
            <polygon points="150,30 230,170 70,170" fill="rgba(255, 255, 255, 0.6)" stroke="rgba(148, 163, 184, 0.5)" stroke-width="2" />
            <polygon points="150,30 230,170 70,170" fill="url(#prism-grad)" opacity="0.3" />

            <!-- Refracted Spectrum -->
            <g class="spectrum-beam">
                <path d="M185 125 L300 90" stroke="#ff4d4d" stroke-width="3" />
                <path d="M187 128 L300 102" stroke="#ffa64d" stroke-width="3" />
                <path d="M189 131 L300 114" stroke="#ffff4d" stroke-width="3" />
                <path d="M191 134 L300 126" stroke="#4dff88" stroke-width="3" />
                <path d="M193 137 L300 138" stroke="#4d94ff" stroke-width="3" />
                <path d="M195 140 L300 150" stroke="#b366ff" stroke-width="3" />
            </g>

            <defs>
                <linearGradient id="prism-grad" x1="150" y1="30" x2="150" y2="170" gradientUnits="userSpaceOnUse">
                    <stop stop-color="white" stop-opacity="0.8"/>
                    <stop offset="1" stop-color="#e2e8f0" stop-opacity="0.2"/>
                </linearGradient>
            </defs>
        </svg>

        <!-- Twemoji Space Emoji Target -->
        <div class="emoji-core">🌌</div>
    </div>

    <h1 class="title">supernebula23</h1>
    <div class="spectrum-bar"></div>

    <!-- Script to render Twemoji -->
    <script>
        twemoji.parse(document.body);
    </script>
</body>
</html>
