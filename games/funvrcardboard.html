<!DOCTYPE html>
<html>
  <head>
    <title>Gaze Steering VR World</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
      #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 999;
        background: rgba(15, 15, 30, 0.85);
        color: #00ffcc;
        padding: 12px;
        font-family: monospace;
        border-radius: 8px;
        border: 1px solid #00ffcc;
      }
      #motion-status {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 8px 16px;
        font-family: sans-serif;
        border-radius: 20px;
        font-size: 14px;
        pointer-events: none;
      }
      input, button { padding: 6px; margin-top: 5px; background: #222; color: #00ffcc; border: 1px solid #00ffcc; }
    </style>
  </head>
  <body>
    <!-- Multiplayer UI Overlay -->
    <div id="ui">
      <div>MY PEER ID: <b id="my-id">...</b></div>
      <hr style="border-color: #00ffcc;" />
      <input type="text" id="remote-id" placeholder="Enter Friend's ID" />
      <button onclick="connectToPeer()">CONNECT</button>
      <div id="status" style="color: #ff00ff; margin-top: 5px;"></div>
    </div>

    <!-- On-screen movement toggle notification -->
    <div id="motion-status">Movement: <b id="move-state" style="color: #00ffaa;">MOVING</b> (Look down to toggle)</div>

    <a-scene>
      <!-- Deep Space Atmosphere -->
      <a-sky color="#050510"></a-sky>
      
      <!-- Ambient Lights -->
      <a-light type="ambient" color="#443366"></a-light>
      <a-light type="directional" position="-1 2 1" intensity="0.8" color="#00ffff"></a-light>

      <!-- ================= THE FUN NEON WORLD ================= -->
      
      <!-- Central Island Floor -->
      <a-cylinder position="0 -0.5 0" radius="10" height="1" color="#121225" metalness="0.5"></a-cylinder>
      <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="9.8" radius-outer="10" color="#00ffcc"></a-ring>

      <!-- Center Glowing Crystal Beacon -->
      <a-octahedron position="0 2.5 0" radius="1.2" color="#ff00ff" material="emissive: #ff00ff; emissiveIntensity: 0.5"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
        animation__bounce="property: position; to: 0 3.2 0; dir: alternate; loop: true; dur: 2500; easing: easeInOutSine">
      </a-octahedron>

      <!-- Decorative Cyber Trees / Pillars -->
      <a-cylinder position="-5 1.5 -5" radius="0.3" height="3" color="#ff00aa"></a-cylinder>
      <a-dodecahedron position="-5 3.5 -5" radius="1" color="#00ffcc" material="wireframe: true"></a-dodecahedron>

      <a-cylinder position="5 1.5 -5" radius="0.3" height="3" color="#ff00aa"></a-cylinder>
      <a-dodecahedron position="5 3.5 -5" radius="1" color="#00ffcc" material="wireframe: true"></a-dodecahedron>

      <!-- Floating Outer Islands -->
      <a-cylinder position="0 3 -20" radius="5" height="0.8" color="#181830"></a-cylinder>
      <a-torus position="0 5 -20" radius="1.5" radius-tubular="0.05" color="#00ffcc" animation="property: rotation; to: 360 360 0; loop: true; dur: 8000; easing: linear"></a-torus>

      <a-cylinder position="-18 5 0" radius="4" height="0.8" color="#181830"></a-cylinder>
      <a-torus position="-18 7 0" radius="1.5" radius-tubular="0.05" color="#ff00aa" animation="property: rotation; to: 0 360 360; loop: true; dur: 8000; easing: linear"></a-torus>

      <!-- Teleport Warp Rings (Gaze at them to warp instantly!) -->
      <a-torus class="clickable warp-ring" position="0 1 -8" radius="0.8" radius-tubular="0.08" color="#00ffcc" rotation="0 0 0"
        animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; loop: true; dur: 1000">
      </a-torus>
      
      <!-- ================= PLAYER & CAMERA RIG ================= -->

      <a-entity id="camera-rig" position="0 0 5">
        <a-camera id="local-camera" look-controls>
          <!-- Gaze Reticle -->
          <a-cursor
            id="cursor"
            raycaster="objects: .clickable"
            fuse="true"
            fuse-timeout="1200"
            color="#00ffcc"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
            animation__fusing="property: scale; startEvents: fusing; easing: linear; dur: 1200; from: 1 1 1; to: 0.2 0.2 0.2"
            animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeOutCubic; dur: 150; to: 1 1 1"
            animation__click="property: scale; startEvents: click; easing: easeOutCubic; dur: 150; from: 0.2 0.2 0.2; to: 1 1 1">
          </a-cursor>
        </a-camera>
      </a-entity>

      <!-- Remote Player Avatar -->
      <a-entity id="remote-avatar" visible="false">
        <a-cone color="#ff00aa" radius-bottom="0.4" radius-top="0" height="1.2" position="0 1 0"></a-cone>
        <a-sphere color="#00ffcc" radius="0.25" position="0 1.6 0"></a-sphere>
      </a-entity>
    </a-scene>

    <script>
      // ================= GAZE MOVEMENT LOGIC =================
      const cameraRig = document.getElementById('camera-rig');
      const localCamera = document.getElementById('local-camera');
      const moveStateEl = document.getElementById('move-state');

      let isMoving = true;
      let canToggle = true; // Debounce lock to prevent rapid stutter toggling
      const MOVE_SPEED = 0.05; // Walking speed
      const LOOK_DOWN_ANGLE = -45; // Pitch angle threshold to trigger pause/resume

      // Main Loop: Runs every single rendered frame
      AFRAME.registerComponent('gaze-steering', {
        tick: function () {
          if (!localCamera) return;

          // Get camera rotation angles in degrees
          const rotation = localCamera.getAttribute('rotation');
          const pitch = rotation.x; // Looking up/down
          const yaw = rotation.y;   // Looking left/right

          // 1. CHECK LOOK-DOWN TOGGLE (Pitch below -45 degrees)
          if (pitch < LOOK_DOWN_ANGLE) {
            if (canToggle) {
              isMoving = !isMoving; // Flip movement state
              canToggle = false;    // Lock toggle until looking back up

              // Update visual feedback indicator
              if (isMoving) {
                moveStateEl.innerText = "MOVING";
                moveStateEl.style.color = "#00ffaa";
              } else {
                moveStateEl.innerText = "PAUSED";
                moveStateEl.style.color = "#ff3366";
              }
            }
          } else if (pitch > -30) {
            // Unlock toggle once player looks back up toward horizon
            canToggle = true;
          }

          // 2. MOVE IN GAZE DIRECTION
          if (isMoving) {
            // Convert Yaw rotation angle to radians
            const yawRad = THREE.MathUtils.degToRad(yaw);

            // Calculate forward direction vector based on head orientation
            const currentPos = cameraRig.getAttribute('position');
            currentPos.x -= Math.sin(yawRad) * MOVE_SPEED;
            currentPos.z -= Math.cos(yawRad) * MOVE_SPEED;

            // Apply new coordinates to the camera rig
            cameraRig.setAttribute('position', currentPos);
          }
        }
      });

      // Attach movement script to the scene
      document.querySelector('a-scene').setAttribute('gaze-steering', '');

      // Warp Ring Interaction
      document.querySelectorAll('.warp-ring').forEach(ring => {
        ring.addEventListener('click', () => {
          // Warp player 5 units forward when gazing at a warp ring
          const currentPos = cameraRig.getAttribute('position');
          cameraRig.setAttribute('position', { x: currentPos.x, y: currentPos.y, z: currentPos.z - 8 });
        });
      });

      // ================= MULTIPLAYER NETWORK LOGIC =================
      const peer = new Peer();
      let conn = null;

      peer.on('open', (id) => { document.getElementById('my-id').innerText = id; });
      peer.on('connection', (connection) => { conn = connection; setupConnection(); });

      function connectToPeer() {
        const destId = document.getElementById('remote-id').value;
        if (!destId) return;
        conn = peer.connect(destId);
        setupConnection();
      }

      function setupConnection() {
        const remoteAvatar = document.getElementById('remote-avatar');
        conn.on('open', () => {
          document.getElementById('status').innerText = "CONNECTED!";
          remoteAvatar.setAttribute('visible', 'true');
          setInterval(sendTransform, 50); // Send sync packet 20x/sec
        });

        conn.on('data', (data) => {
          if (data.pos) remoteAvatar.setAttribute('position', data.pos);
          if (data.rot) remoteAvatar.setAttribute('rotation', data.rot);
        });
      }

      function sendTransform() {
        if (!conn || !conn.open) return;
        const rigPos = cameraRig.getAttribute('position');
        const camRot = localCamera.getAttribute('rotation');
        conn.send({
          pos: `${rigPos.x} ${rigPos.y} ${rigPos.z}`,
          rot: `${camRot.x} ${camRot.y} ${camRot.z}`
        });
      }
    </script>
  </body>
</html>
