<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dots & Boxes Multiplayer</title>
  <!-- PeerJS for WebRTC signaling -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --panel: #131c2e;
      --panel-border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --p1: #f43f5e;
      --p1-glow: rgba(244, 63, 94, 0.35);
      --p2: #3b82f6;
      --p2-glow: rgba(59, 130, 246, 0.35);
      --dot: #475569;
      --line-idle: #1e293b;
      --line-hover: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { 
      box-sizing: border-box; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      margin: 0; 
      padding: 0; 
    }

    body { 
      background: var(--bg); 
      background-image: 
        radial-gradient(at 20% 20%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(59, 130, 246, 0.08) 0px, transparent 50%);
      color: var(--text); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 24px 16px; 
    }
    
    .container { 
      background: var(--panel); 
      border: 1px solid var(--panel-border);
      border-radius: 20px; 
      padding: 32px; 
      max-width: 620px; 
      width: 100%; 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); 
      text-align: center; 
    }
    
    /* Header & Navigation */
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 24px; 
    }

    .home-btn { 
      background: rgba(255, 255, 255, 0.05); 
      color: var(--text-muted); 
      text-decoration: none; 
      padding: 10px 18px; 
      border-radius: 8px; 
      font-weight: 600; 
      font-size: 14px; 
      border: 1px solid var(--panel-border);
      transition: all 0.2s ease; 
    }

    .home-btn:hover { 
      background: rgba(255, 255, 255, 0.1); 
      color: var(--text);
    }
    
    h1 { 
      font-size: 28px; 
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Lobby Controls */
    .lobby { 
      margin-bottom: 24px; 
      background: rgba(0, 0, 0, 0.25); 
      padding: 18px; 
      border-radius: 12px; 
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .status { 
      font-weight: 600; 
      font-size: 15px; 
      color: var(--text-muted); 
    }

    .btn { 
      background: var(--accent); 
      color: #0f172a; 
      border: none; 
      padding: 12px 24px; 
      font-weight: 700; 
      border-radius: 8px; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      font-size: 14px; 
      margin-top: 12px;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }

    .btn:hover { 
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.35);
    }
    
    /* Scoreboard */
    .scoreboard { 
      display: flex; 
      justify-content: space-around; 
      margin-bottom: 28px; 
      padding: 16px; 
      background: rgba(0, 0, 0, 0.25); 
      border-radius: 12px; 
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .score-card { 
      font-size: 16px; 
      font-weight: 700; 
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .score-val {
      font-size: 28px;
      font-weight: 800;
    }

    .p1-color { color: var(--p1); }
    .p2-color { color: var(--p2); }

    /* Board Graphics - Scaled Up */
    .board-outer {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      overflow-x: auto;
      padding: 10px 0;
    }

    #board { 
      display: inline-grid; 
      gap: 0; 
      background: rgba(0, 0, 0, 0.3); 
      padding: 20px; 
      border-radius: 16px; 
      border: 1px solid var(--panel-border);
    }
    
    /* Scaled dimensions: Dots, Lines, and Boxes are ~40% larger */
    .dot { 
      width: 16px; 
      height: 16px; 
      background: var(--dot); 
      border-radius: 50%; 
      justify-self: center; 
      align-self: center; 
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }
    
    .h-line { 
      height: 16px; 
      width: 72px; 
      background: var(--line-idle); 
      cursor: pointer; 
      border-radius: 8px; 
      align-self: center; 
      transition: background 0.15s ease;
    }

    .v-line { 
      width: 16px; 
      height: 72px; 
      background: var(--line-idle); 
      cursor: pointer; 
      border-radius: 8px; 
      justify-self: center; 
      transition: background 0.15s ease;
    }

    .h-line:hover:not(.taken), 
    .v-line:hover:not(.taken) { 
      background: var(--line-hover); 
    }
    
    .taken { 
      cursor: default; 
    }

    .taken.p1 { 
      background: var(--p1); 
      box-shadow: 0 0 12px var(--p1-glow);
    }

    .taken.p2 { 
      background: var(--p2); 
      box-shadow: 0 0 12px var(--p2-glow);
    }

    .box { 
      width: 72px; 
      height: 72px; 
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 800; 
      font-size: 24px; 
      transition: all 0.25s ease;
    }

    .box.p1 { 
      background: rgba(244, 63, 94, 0.15); 
      color: var(--p1); 
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .box.p2 { 
      background: rgba(59, 130, 246, 0.15); 
      color: var(--p2); 
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    @media (max-width: 480px) {
      .container { padding: 20px 16px; }
      .h-line { width: 52px; height: 14px; }
      .v-line { height: 52px; width: 14px; }
      .box { width: 52px; height: 52px; font-size: 20px; }
      .dot { width: 14px; height: 14px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Dots & Boxes</h1>
      <a href="https://supernebula23.github.io/games" class="home-btn">← Home</a>
    </header>

    <div class="lobby">
      <div id="status" class="status">Connecting to network...</div>
      <button id="copy-btn" class="btn" style="display: none;" onclick="copyInviteLink()">Copy Invite Link</button>
    </div>

    <div class="scoreboard">
      <div class="score-card p1-color">
        <span>Player 1 (Red)</span>
        <span id="score1" class="score-val">0</span>
      </div>
      <div class="score-card p2-color">
        <span>Player 2 (Blue)</span>
        <span id="score2" class="score-val">0</span>
      </div>
    </div>

    <div class="board-outer">
      <div id="board"></div>
    </div>
  </div>

  <script>
    // Configuration
    const GRID_SIZE = 4; // 4x4 dots = 3x3 boxes grid
    let peer, conn;
    let myPlayerId = null; // 1 or 2
    let currentTurn = 1;
    let isMyTurn = false;
    
    // Game State Structures
    const hLines = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE - 1).fill(0));
    const vLines = Array.from({ length: GRID_SIZE - 1 }, () => Array(GRID_SIZE).fill(0));
    const boxes = Array.from({ length: GRID_SIZE - 1 }, () => Array(GRID_SIZE - 1).fill(0));
    let score1 = 0, score2 = 0;

    const statusEl = document.getElementById('status');
    const copyBtn = document.getElementById('copy-btn');

    // 1. Connection Initialization
    function initConnection() {
      const urlParams = new URLSearchParams(window.location.search);
      const hostId = urlParams.get('room');

      peer = new Peer();

      peer.on('open', (id) => {
        if (hostId) {
          // Player 2 Joining
          myPlayerId = 2;
          statusEl.innerText = "Connecting to Host...";
          conn = peer.connect(hostId);
          setupConnectionListeners();
        } else {
          // Player 1 Hosting
          myPlayerId = 1;
          isMyTurn = true;
          statusEl.innerText = "Waiting for Player 2 to join...";
          copyBtn.style.display = "inline-block";
          
          peer.on('connection', (c) => {
            conn = c;
            setupConnectionListeners();
            statusEl.innerText = "Player 2 Connected! Your turn (Red).";
          });
        }
      });

      peer.on('error', (err) => {
        statusEl.innerText = "Connection Error: " + err.type;
      });
    }

    function setupConnectionListeners() {
      conn.on('open', () => {
        if (myPlayerId === 2) {
          statusEl.innerText = "Connected! Player 1's turn (Red).";
        }
      });

      conn.on('data', (data) => {
        if (data.type === 'MOVE') {
          handleMove(data.lineType, data.r, data.c, data.player, false);
        }
      });
    }

    function copyInviteLink() {
      const roomUrl = `${window.location.origin}${window.location.pathname}?room=${peer.id}`;
      navigator.clipboard.writeText(roomUrl).then(() => {
        copyBtn.innerText = "Link Copied!";
        setTimeout(() => copyBtn.innerText = "Copy Invite Link", 2000);
      });
    }

    // 2. Render Board
    function buildBoard() {
      const board = document.getElementById('board');
      board.style.gridTemplateColumns = `repeat(${GRID_SIZE * 2 - 1}, auto)`;

      for (let r = 0; r < GRID_SIZE * 2 - 1; r++) {
        for (let c = 0; c < GRID_SIZE * 2 - 1; c++) {
          const isRowEven = r % 2 === 0;
          const isColEven = c % 2 === 0;

          if (isRowEven && isColEven) {
            // Dot
            const dot = document.createElement('div');
            dot.className = 'dot';
            board.appendChild(dot);
          } else if (isRowEven && !isColEven) {
            // Horizontal Line
            const line = document.createElement('div');
            line.className = 'h-line';
            const row = r / 2;
            const col = (c - 1) / 2;
            line.id = `h-${row}-${col}`;
            line.onclick = () => onLineClick('h', row, col);
            board.appendChild(line);
          } else if (!isRowEven && isColEven) {
            // Vertical Line
            const line = document.createElement('div');
            line.className = 'v-line';
            const row = (r - 1) / 2;
            const col = c / 2;
            line.id = `v-${row}-${col}`;
            line.onclick = () => onLineClick('v', row, col);
            board.appendChild(line);
          } else {
            // Box Space
            const box = document.createElement('div');
            box.className = 'box';
            const row = (r - 1) / 2;
            const col = (c - 1) / 2;
            box.id = `box-${row}-${col}`;
            board.appendChild(box);
          }
        }
      }
    }

    // 3. Game Logic & Turn Handling
    function onLineClick(type, r, c) {
      if (!isMyTurn || !conn) return;
      const isTaken = type === 'h' ? hLines[r][c] : vLines[r][c];
      if (isTaken) return;

      handleMove(type, r, c, myPlayerId, true);
    }

    function handleMove(type, r, c, player, isLocal) {
      // Mark Line
      const el = document.getElementById(`${type}-${r}-${c}`);
      el.classList.add('taken', `p${player}`);
      if (type === 'h') hLines[r][c] = player;
      else vLines[r][c] = player;

      // Check Box Completion
      const completedBoxes = checkBoxes(type, r, c, player);

      if (isLocal && conn) {
        conn.send({ type: 'MOVE', lineType: type, r: r, c: c, player: player });
      }

      if (completedBoxes === 0) {
        // Switch Turn
        currentTurn = currentTurn === 1 ? 2 : 1;
        isMyTurn = (currentTurn === myPlayerId);
      } else {
        // Player gets another turn if they completed a box
        isMyTurn = (currentTurn === myPlayerId);
      }

      updateStatusUI();
    }

    function checkBoxes(type, r, c, player) {
      let completed = 0;
      const check = (br, bc) => {
        if (br >= 0 && br < GRID_SIZE - 1 && bc >= 0 && bc < GRID_SIZE - 1) {
          if (hLines[br][bc] && hLines[br + 1][bc] && vLines[br][bc] && vLines[br][bc + 1]) {
            if (boxes[br][bc] === 0) {
              boxes[br][bc] = player;
              const boxEl = document.getElementById(`box-${br}-${bc}`);
              boxEl.classList.add(`p${player}`);
              boxEl.innerText = player === 1 ? 'R' : 'B';
              if (player === 1) score1++; else score2++;
              completed++;
            }
          }
        }
      };

      if (type === 'h') {
        check(r - 1, c); // Box above
        check(r, c);     // Box below
      } else {
        check(r, c - 1); // Box left
        check(r, c);     // Box right
      }

      document.getElementById('score1').innerText = score1;
      document.getElementById('score2').innerText = score2;
      return completed;
    }

    function updateStatusUI() {
      const totalBoxes = (GRID_SIZE - 1) * (GRID_SIZE - 1);
      if (score1 + score2 === totalBoxes) {
        if (score1 > score2) statusEl.innerText = "Game Over! Player 1 Wins!";
        else if (score2 > score1) statusEl.innerText = "Game Over! Player 2 Wins!";
        else statusEl.innerText = "Game Over! It's a Tie!";
        return;
      }

      if (isMyTurn) {
        statusEl.innerText = `Your Turn (${myPlayerId === 1 ? 'Red' : 'Blue'})`;
      } else {
        statusEl.innerText = `Waiting for Opponent (${currentTurn === 1 ? 'Red' : 'Blue'})...`;
      }
    }

    // Initialize Game
    buildBoard();
    initConnection();
  </script>
</body>
</html>
