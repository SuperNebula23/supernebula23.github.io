<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Match Showdown - Deluxe</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      margin: 0;
      background: #0f0f15;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }
    .card {
      background: #181822;
      border: 2px solid #2a2a3a;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      text-align: center;
      position: relative;
    }

    /* Top Navigation Header & Home Button */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: #232332;
      border: 1px solid #3d3d52;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .home-btn:hover {
      background: #333348;
      border-color: #ff0055;
      transform: translateY(-1px);
    }

    h1 { margin: 0; color: #ff0055; text-transform: uppercase; letter-spacing: 1.5px; font-size: 22px; }
    
    /* Room Setup */
    .room-setup { display: flex; gap: 8px; margin-bottom: 15px; }
    input[type="text"] {
      padding: 12px; background: #232332; border: 1px solid #3d3d52; color: #fff; border-radius: 8px; flex: 1; font-size: 14px;
    }
    button {
      padding: 12px 20px; background: #ff0055; border: none; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    button:hover { background: #e0004c; transform: translateY(-1px); }
    button:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; }
    
    /* Scores & Header */
    .scoreboard {
      display: flex; justify-content: space-between; align-items: center;
      background: #232332; padding: 10px 16px; border-radius: 10px; margin-bottom: 15px; font-weight: bold;
    }
    .p1-color { color: #00d2d3; } 
    .p2-color { color: #ff9f43; }
    #round-info { color: #ffd700; font-size: 16px; }

    /* Timer Badge */
    #timer-badge {
      font-size: 22px; font-weight: 800; color: #ff4757; margin-bottom: 10px; height: 28px;
    }

    /* Main Display & Side-by-Side Comparisons */
    #display-container {
      width: 100%; height: 130px; border-radius: 12px; border: 3px solid #3d3d52;
      margin-bottom: 15px; position: relative; overflow: hidden; display: flex;
    }
    #color-display {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800; text-shadow: 0 2px 6px rgba(0,0,0,0.8); transition: background-color 0.2s;
    }
    .comparison-panel {
      flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end;
      padding: 8px; font-size: 12px; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    /* Sliders */
    .sliders { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .slider-group { display: flex; align-items: center; gap: 12px; }
    .slider-group label { width: 20px; font-weight: 800; font-size: 18px; }
    input[type="range"] { flex: 1; height: 8px; border-radius: 4px; accent-color: #ff0055; cursor: pointer; }

    /* Status Bar */
    #status { color: #aaa; font-size: 13px; margin-bottom: 12px; min-height: 18px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="top-bar">
      <!-- Home Button linking to your games portal -->
      <a href="https://supernebula23.github.io/games" class="home-btn">
        <span>🏠</span> Home
      </a>
      <h1>Color Match</h1>
      <div style="width: 75px;"></div> <!-- Spacer for visual balance -->
    </div>
    
    <div class="scoreboard">
      <span class="p1-color">P1: <span id="p1-score">0</span>%</span>
      <span id="round-info">Round 1/3</span>
      <span class="p2-color">P2: <span id="p2-score">0</span>%</span>
    </div>

    <div class="room-setup">
      <input type="text" id="join-id" placeholder="Paste Host Room ID">
      <button onclick="joinRoom()">Join Game</button>
    </div>
    <div id="status">Room ID: <b id="my-id" style="color:#00d2d3">Generating...</b></div>
    
    <button id="start-btn" style="width:100%; margin-bottom: 15px;" onclick="startRound()" disabled>Start Game</button>

    <div id="timer-badge"></div>

    <div id="display-container">
      <div id="color-display" style="background-color: #232332;">Waiting to Start...</div>
    </div>

    <!-- Color Mixing Controls -->
    <div class="sliders">
      <div class="slider-group">
        <label style="color:#ff4757">R</label>
        <input type="range" id="r-slider" min="0" max="255" value="128" oninput="updateMixColor()" disabled>
      </div>
      <div class="slider-group">
        <label style="color:#2ed573">G</label>
        <input type="range" id="g-slider" min="0" max="255" value="128" oninput="updateMixColor()" disabled>
      </div>
      <div class="slider-group">
        <label style="color:#1e90ff">B</label>
        <input type="range" id="b-slider" min="0" max="255" value="128" oninput="updateMixColor()" disabled>
      </div>
    </div>

    <button id="lock-btn" style="width:100%;" onclick="lockInGuess()" disabled>Lock In Guess!</button>
  </div>

  <script>
    // Audio Synth for Sound FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    let peer = new Peer();
    let conn = null;
    let isHost = false;

    let round = 1;
    let p1Score = 0;
    let p2Score = 0;
    let targetColor = { r: 0, g: 0, b: 0 };
    let myGuess = null;
    let peerGuess = null;
    let isGuessingPhase = false;
    let timerInterval = null;
    let timeLeft = 15;

    peer.on('open', (id) => {
      document.getElementById('my-id').innerText = id;
    });

    peer.on('connection', (connection) => {
      conn = connection;
      isHost = true;
      setupEvents();
      document.getElementById('status').innerText = "Status: Player 2 Connected!";
      document.getElementById('start-btn').disabled = false;
    });

    function joinRoom() {
      const hostId = document.getElementById('join-id').value.trim();
      if (!hostId) return;
      conn = peer.connect(hostId);
      isHost = false;
      setupEvents();
      document.getElementById('status').innerText = "Status: Connected to Host!";
    }

    function setupEvents() {
      conn.on('data', (data) => {
        if (data.type === 'START_ROUND') {
          handleRoundStart(data.color, data.round);
        } else if (data.type === 'SUBMIT_GUESS') {
          peerGuess = data.guess;
          document.getElementById('status').innerText = "Opponent locked in their guess!";
          checkRoundEnd();
        } else if (data.type === 'ROUND_RESULTS') {
          showResults(data);
        }
      });
    }

    function updateMixColor() {
      if (!isGuessingPhase) return;
      const r = document.getElementById('r-slider').value;
      const g = document.getElementById('g-slider').value;
      const b = document.getElementById('b-slider').value;
      document.getElementById('color-display').style.backgroundColor = `rgb(${r},${g},${b})`;
    }

    function startRound() {
      if (!isHost) return;
      targetColor = {
        r: Math.floor(Math.random() * 256),
        g: Math.floor(Math.random() * 256),
        b: Math.floor(Math.random() * 256)
      };
      conn.send({ type: 'START_ROUND', color: targetColor, round: round });
      handleRoundStart(targetColor, round);
    }

    function handleRoundStart(color, currentRound) {
      round = currentRound;
      targetColor = color;
      myGuess = null;
      peerGuess = null;
      isGuessingPhase = false;
      clearInterval(timerInterval);

      document.getElementById('round-info').innerText = `Round ${round}/3`;
      document.getElementById('lock-btn').disabled = true;
      document.getElementById('start-btn').disabled = true;
      document.getElementById('status').innerText = "Memorize the color!";
      
      const container = document.getElementById('display-container');
      container.innerHTML = `<div id="color-display" style="background-color: rgb(${color.r}, ${color.g}, ${color.b});">MEMORIZE!</div>`;

      setSlidersDisabled(true);
      playBeep(600, 'triangle', 0.2);

      setTimeout(() => {
        document.getElementById('color-display').style.backgroundColor = "rgb(128,128,128)";
        document.getElementById('color-display').innerText = "Recreate Color!";
        
        ['r', 'g', 'b'].forEach(c => document.getElementById(`${c}-slider`).value = 128);
        
        isGuessingPhase = true;
        setSlidersDisabled(false);
        updateMixColor();
        document.getElementById('lock-btn').disabled = false;

        startTimer();
      }, 2000);
    }

    function startTimer() {
      timeLeft = 15;
      updateTimerBadge();
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerBadge();
        if (timeLeft <= 3 && timeLeft > 0) playBeep(800, 'sine', 0.08);

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          playBeep(300, 'sawtooth', 0.3);
          lockInGuess();
        }
      }, 1000);
    }

    function updateTimerBadge() {
      document.getElementById('timer-badge').innerText = `⏱️ ${timeLeft}s`;
    }

    function setSlidersDisabled(state) {
      ['r', 'g', 'b'].forEach(c => document.getElementById(`${c}-slider`).disabled = state);
    }

    function lockInGuess() {
      if (myGuess) return;
      clearInterval(timerInterval);
      
      const r = parseInt(document.getElementById('r-slider').value);
      const g = parseInt(document.getElementById('g-slider').value);
      const b = parseInt(document.getElementById('b-slider').value);
      
      myGuess = { r, g, b };
      isGuessingPhase = false;
      setSlidersDisabled(true);
      document.getElementById('lock-btn').disabled = true;
      document.getElementById('timer-badge').innerText = "LOCKED IN!";
      document.getElementById('color-display').innerText = "Waiting for Opponent...";

      conn.send({ type: 'SUBMIT_GUESS', guess: myGuess });
      checkRoundEnd();
    }

    function checkRoundEnd() {
      if (myGuess && peerGuess && isHost) {
        let hostGuess = myGuess;
        let clientGuess = peerGuess;

        let hostDiff = Math.hypot(targetColor.r - hostGuess.r, targetColor.g - hostGuess.g, targetColor.b - hostGuess.b);
        let clientDiff = Math.hypot(targetColor.r - clientGuess.r, targetColor.g - clientGuess.g, targetColor.b - clientGuess.b);

        let maxDiff = Math.hypot(255, 255, 255);
        let hostAcc = Math.max(0, Math.round((1 - hostDiff / maxDiff) * 100));
        let clientAcc = Math.max(0, Math.round((1 - clientDiff / maxDiff) * 100));

        p1Score += hostAcc;
        p2Score += clientAcc;

        const results = {
          type: 'ROUND_RESULTS',
          target: targetColor,
          p1Guess: hostGuess,
          p2Guess: clientGuess,
          p1Acc: hostAcc,
          p2Acc: clientAcc,
          p1Total: p1Score,
          p2Total: p2Score
        };

        conn.send(results);
        showResults(results);
      }
    }

    function showResults(data) {
      clearInterval(timerInterval);
      document.getElementById('timer-badge').innerText = "ROUND OVER";
      playBeep(523.25, 'triangle', 0.3);

      document.getElementById('p1-score').innerText = data.p1Total;
      document.getElementById('p2-score').innerText = data.p2Total;

      let myAcc = isHost ? data.p1Acc : data.p2Acc;
      let oppAcc = isHost ? data.p2Acc : data.p1Acc;
      let myColor = isHost ? data.p1Guess : data.p2Guess;
      let oppColor = isHost ? data.p2Guess : data.p1Guess;

      const container = document.getElementById('display-container');
      container.innerHTML = `
        <div class="comparison-panel" style="background-color: rgb(${data.target.r},${data.target.g},${data.target.b}); border-right:2px solid #000;">
          TARGET COLOR
        </div>
        <div class="comparison-panel" style="background-color: rgb(${myColor.r},${myColor.g},${myColor.b});">
          YOU (${myAcc}%)
        </div>
        <div class="comparison-panel" style="background-color: rgb(${oppColor.r},${oppColor.g},${oppColor.b});">
          OPPONENT (${oppAcc}%)
        </div>
      `;

      if (round < 3) {
        round++;
        document.getElementById('status').innerText = "Next round starting shortly...";
        if (isHost) setTimeout(startRound, 5000);
      } else {
        setTimeout(() => {
          let winnerText = "";
          if (data.p1Total > data.p2Total) winnerText = isHost ? "🎉 YOU WIN!" : "OPPONENT WINS!";
          else if (data.p2Total > data.p1Total) winnerText = isHost ? "OPPONENT WINS!" : "🎉 YOU WIN!";
          else winnerText = "IT'S A TIE!";
          
          document.getElementById('timer-badge').innerText = winnerText;
          document.getElementById('status').innerText = "Game Over!";
          if (isHost) document.getElementById('start-btn').disabled = false;
        }, 2000);
      }
    }
  </script>
</body>
</html>
