<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Bird - OG Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: #0b1d28;
      font-family: 'Press Start 2P', cursive, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
      overflow: hidden;
      padding: 12px;
    }

    .game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-bar {
      width: min(92vw, 432px);
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 12px;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: #f85800;
      color: #fff;
      text-decoration: none;
      font-family: 'Press Start 2P', cursive, monospace;
      font-size: 11px;
      border: 3px solid #000;
      border-radius: 8px;
      box-shadow: 0 4px 0 #000;
      transition: all 0.12s ease;
      cursor: pointer;
    }

    .home-btn:hover {
      background: #e04e00;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #000;
    }

    .home-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #000;
    }

    #canvas-container {
      position: relative;
      border: 4px solid #000;
      border-radius: 10px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.8);
      overflow: hidden;
      background: #70c5ce;
      width: min(92vw, 432px);
      aspect-ratio: 288 / 512;
      max-height: 80vh;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .controls-hint {
      margin-top: 14px;
      font-size: 11px;
      color: #a0c4d6;
      text-align: center;
      letter-spacing: 1px;
      text-shadow: 1px 1px 0 #000;
    }

    .flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease-out;
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="top-bar">
      <a href="https://supernebula23.github.io/games" class="home-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>HOME</span>
      </a>
    </div>
    <div id="canvas-container">
      <canvas id="gameCanvas" width="288" height="512"></canvas>
      <div id="flash" class="flash-overlay"></div>
    </div>
    <div class="controls-hint">PRESS SPACE / TAP TO FLAP</div>
  </div>

  <script>
    // 8-Bit Retro Sound Synthesizer (No external audio files needed)
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playFlap() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(320, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(620, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      },
      playScore() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
        osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.08); // A5
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
      },
      playHit() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
      },
      playSwoosh() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const flashEl = document.getElementById('flash');

    // Canvas Constants
    const WIDTH = 288;
    const HEIGHT = 512;
    const GROUND_HEIGHT = 112;

    // Game Physics Parameters
    const GRAVITY = 0.26;
    const JUMP_STRENGTH = -5.1;
    const PIPE_SPEED = 1.75;
    const PIPE_SPAWN_RATE = 95;
    const PIPE_GAP = 100;

    let frames = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('og_flappy_highscore')) || 0;
    let gameState = 'START'; // START, PLAY, FALLING, OVER

    const bird = {
      x: 68,
      y: 230,
      radius: 11,
      velocity: 0,
      rotation: 0,
      wingFrame: 0,
      animTimer: 0,

      flap() {
        this.velocity = JUMP_STRENGTH;
        AudioEngine.playFlap();
      },

      update() {
        // Wing Flap Animation
        this.animTimer++;
        if (this.animTimer % 5 === 0) {
          this.wingFrame = (this.wingFrame + 1) % 3;
        }

        if (gameState === 'START') {
          // Hover floating effect
          this.y = 230 + Math.sin(frames * 0.08) * 5;
          this.rotation = 0;
        } else if (gameState === 'PLAY' || gameState === 'FALLING') {
          this.velocity += GRAVITY;
          this.y += this.velocity;

          // Velocity to Rotation Interpolation
          if (this.velocity < 0) {
            this.rotation = -0.35; // Tilt up on jump
          } else {
            this.rotation += 0.045; // Dive down when falling
            if (this.rotation > Math.PI / 2) {
              this.rotation = Math.PI / 2; // Cap at vertical dive
            }
          }

          // Ceiling bounds
          if (this.y < this.radius) {
            this.y = this.radius;
            this.velocity = 0;
          }

          // Ground Collision
          if (this.y + this.radius >= HEIGHT - GROUND_HEIGHT) {
            this.y = HEIGHT - GROUND_HEIGHT - this.radius;
            if (gameState === 'PLAY' || gameState === 'FALLING') {
              triggerHit();
            }
          }
        }
      },

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // Pixel Art Flappy Bird
        // Outer Black Outline
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(0, 0, 13, 0, Math.PI * 2);
        ctx.fill();

        // Yellow Body
        ctx.fillStyle = '#f8b800';
        ctx.beginPath();
        ctx.arc(-1, 0, 11, 0, Math.PI * 2);
        ctx.fill();

        // Belly White Highlight
        ctx.fillStyle = '#f8f8f8';
        ctx.beginPath();
        ctx.arc(-4, 4, 6, 0, Math.PI * 2);
        ctx.fill();

        // Wing
        ctx.fillStyle = '#f8f8f8';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        if (this.wingFrame === 0) {
          // Wing Up
          ctx.ellipse(-6, -2, 6, 4, -Math.PI / 6, 0, Math.PI * 2);
        } else if (this.wingFrame === 1) {
          // Wing Mid
          ctx.ellipse(-6, 1, 6, 3, 0, 0, Math.PI * 2);
        } else {
          // Wing Down
          ctx.ellipse(-6, 4, 6, 4, Math.PI / 6, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.stroke();

        // Eye
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(2, -8, 8, 10);
        ctx.fillStyle = '#000000';
        ctx.fillRect(6, -6, 3, 5); // Pupil

        // Beak (Orange/Red)
        ctx.fillStyle = '#f83800';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.fillRect(3, 2, 10, 6);
        ctx.strokeRect(3, 2, 10, 6);
        ctx.fillStyle = '#f8b800'; // Lip line
        ctx.fillRect(3, 5, 9, 1);

        ctx.restore();
      },

      reset() {
        this.y = 230;
        this.velocity = 0;
        this.rotation = 0;
      }
    };

    const pipes = {
      items: [],

      update() {
        if (gameState !== 'PLAY') return;

        // Spawn Pipes
        if (frames % PIPE_SPAWN_RATE === 0) {
          const minPos = 50;
          const maxPos = HEIGHT - GROUND_HEIGHT - PIPE_GAP - 50;
          const randomTopY = Math.floor(Math.random() * (maxPos - minPos + 1) + minPos);

          this.items.push({
            x: WIDTH,
            topY: randomTopY,
            passed: false
          });
        }

        for (let i = 0; i < this.items.length; i++) {
          let p = this.items[i];
          p.x -= PIPE_SPEED;

          // Score Logic
          if (!p.passed && p.x + 52 < bird.x) {
            p.passed = true;
            score++;
            AudioEngine.playScore();
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('og_flappy_highscore', highScore);
            }
          }

          // Precise AABB Collision Box
          const birdBox = {
            left: bird.x - bird.radius + 2,
            right: bird.x + bird.radius - 2,
            top: bird.y - bird.radius + 2,
            bottom: bird.y + bird.radius - 2
          };

          const topPipeBox = { left: p.x, right: p.x + 52, top: 0, bottom: p.topY };
          const bottomPipeBox = { left: p.x, right: p.x + 52, top: p.topY + PIPE_GAP, bottom: HEIGHT - GROUND_HEIGHT };

          if (checkOverlap(birdBox, topPipeBox) || checkOverlap(birdBox, bottomPipeBox)) {
            triggerHit();
          }

          // Remove offscreen
          if (p.x + 52 < 0) {
            this.items.splice(i, 1);
            i--;
          }
        }
      },

      draw() {
        for (let i = 0; i < this.items.length; i++) {
          let p = this.items[i];
          drawRetroPipe(p.x, 0, 52, p.topY, true); // Top Pipe
          drawRetroPipe(p.x, p.topY + PIPE_GAP, 52, HEIGHT - GROUND_HEIGHT - (p.topY + PIPE_GAP), false); // Bottom Pipe
        }
      },

      reset() {
        this.items = [];
      }
    };

    function checkOverlap(r1, r2) {
      return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
    }

    // Custom Canvas Renderer for OG Arcade Pipe Style
    function drawRetroPipe(x, y, width, height, isTop) {
      ctx.save();
      // Main Body Fill
      ctx.fillStyle = '#73bf2e';
      ctx.fillRect(x, y, width, height);

      // Highlights & Shadows
      ctx.fillStyle = '#9ce659'; // Light Green Highlight
      ctx.fillRect(x + 4, y, 6, height);
      ctx.fillStyle = '#558022'; // Dark Green Shadow
      ctx.fillRect(x + width - 10, y, 6, height);

      // Outline
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(x, y, width, height);

      // Pipe Cap
      const capHeight = 24;
      const capWidth = width + 6;
      const capX = x - 3;
      const capY = isTop ? y + height - capHeight : y;

      ctx.fillStyle = '#73bf2e';
      ctx.fillRect(capX, capY, capWidth, capHeight);

      ctx.fillStyle = '#9ce659';
      ctx.fillRect(capX + 4, capY, 6, capHeight);

      ctx.fillStyle = '#558022';
      ctx.fillRect(capX + capWidth - 10, capY, 6, capHeight);

      ctx.strokeRect(capX, capY, capWidth, capHeight);
      ctx.restore();
    }

    const environment = {
      groundOffset: 0,

      update() {
        if (gameState === 'PLAY' || gameState === 'START') {
          this.groundOffset = (this.groundOffset + PIPE_SPEED) % 14;
        }
      },

      draw() {
        // Sky Background
        ctx.fillStyle = '#70c5ce';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // Retro City Skyline & Trees Backdrop
        const bgBaseY = HEIGHT - GROUND_HEIGHT;

        // City Buildings
        ctx.fillStyle = '#4cb0af';
        ctx.fillRect(10, bgBaseY - 60, 30, 60);
        ctx.fillRect(25, bgBaseY - 80, 24, 80);
        ctx.fillRect(60, bgBaseY - 50, 35, 50);
        ctx.fillRect(110, bgBaseY - 90, 28, 90);
        ctx.fillRect(150, bgBaseY - 65, 32, 65);
        ctx.fillRect(200, bgBaseY - 75, 26, 75);
        ctx.fillRect(235, bgBaseY - 55, 40, 55);

        // Building Windows
        ctx.fillStyle = '#70c5ce';
        for (let bx = 15; bx < WIDTH; bx += 32) {
          ctx.fillRect(bx, bgBaseY - 45, 4, 6);
          ctx.fillRect(bx, bgBaseY - 30, 4, 6);
        }

        // Bush / Tree Silhouettes
        ctx.fillStyle = '#52c073';
        for (let tx = -10; tx < WIDTH + 30; tx += 40) {
          ctx.beginPath();
          ctx.arc(tx, bgBaseY - 12, 18, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#3ca15c';
        for (let tx = 10; tx < WIDTH + 30; tx += 40) {
          ctx.beginPath();
          ctx.arc(tx, bgBaseY - 8, 14, 0, Math.PI * 2);
          ctx.fill();
        }

        // Moving Ground Floor
        ctx.fillStyle = '#ded895'; // Sand Color
        ctx.fillRect(0, bgBaseY, WIDTH, GROUND_HEIGHT);

        // Green Grass Top Layer
        ctx.fillStyle = '#73bf2e';
        ctx.fillRect(0, bgBaseY, WIDTH, 15);
        ctx.fillStyle = '#558022';
        ctx.fillRect(0, bgBaseY + 12, WIDTH, 3);

        // Diagonal Striped Pattern on Ground Border
        ctx.fillStyle = '#9ce659';
        for (let x = -this.groundOffset; x < WIDTH + 14; x += 14) {
          ctx.beginPath();
          ctx.moveTo(x, bgBaseY);
          ctx.lineTo(x + 7, bgBaseY);
          ctx.lineTo(x, bgBaseY + 12);
          ctx.closePath();
          ctx.fill();
        }

        // Black Ground Dividing Line
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, bgBaseY);
        ctx.lineTo(WIDTH, bgBaseY);
        ctx.stroke();
      }
    };

    function triggerHit() {
      if (gameState === 'OVER') return;
      
      AudioEngine.playHit();
      
      // Screen Flash Effect
      flashEl.style.opacity = '0.85';
      setTimeout(() => { flashEl.style.opacity = '0'; }, 80);

      if (gameState === 'PLAY') {
        gameState = 'FALLING';
        setTimeout(() => {
          AudioEngine.playSwoosh();
        }, 120);
      } else {
        gameState = 'OVER';
      }
    }

    function drawScoreUI() {
      ctx.save();
      if (gameState === 'PLAY') {
        // Big Arcade Counter
        ctx.font = '28px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 5;
        ctx.strokeText(score, WIDTH / 2, 70);
        ctx.fillText(score, WIDTH / 2, 70);
      } else if (gameState === 'START') {
        // "GET READY" Banner
        ctx.font = '16px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f85800';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.strokeText('GET READY!', WIDTH / 2, 170);
        ctx.fillText('GET READY!', WIDTH / 2, 170);

        // Tap Icon Helper
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.font = '10px "Press Start 2P"';
        ctx.strokeText('TAP OR SPACE', WIDTH / 2, 300);
        ctx.fillText('TAP OR SPACE', WIDTH / 2, 300);
      } else if (gameState === 'OVER') {
        // Game Over Board Container
        const boardX = 24;
        const boardY = 170;
        const boardW = 240;
        const boardH = 150;

        // Outer Shadow & Border
        ctx.fillStyle = '#ded895';
        ctx.fillRect(boardX, boardY, boardW, boardH);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.strokeRect(boardX, boardY, boardW, boardH);

        // Header Title Badge
        ctx.font = '16px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f85800';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.strokeText('GAME OVER', WIDTH / 2, 135);
        ctx.fillText('GAME OVER', WIDTH / 2, 135);

        // Score Labels
        ctx.font = '9px "Press Start 2P"';
        ctx.textAlign = 'left';
        ctx.fillStyle = '#e86800';
        ctx.fillText('SCORE', boardX + 130, boardY + 42);
        ctx.fillText('BEST', boardX + 130, boardY + 92);

        // Numeric Values
        ctx.font = '14px "Press Start 2P"';
        ctx.textAlign = 'right';
        ctx.fillStyle = '#000000';
        ctx.fillText(score, boardX + 215, boardY + 65);
        ctx.fillText(highScore, boardX + 215, boardY + 115);

        // Medal Rendering
        ctx.textAlign = 'center';
        ctx.fillText('MEDAL', boardX + 55, boardY + 42);

        let medalColor = null;
        if (score >= 40) medalColor = '#e5e4e2'; // Platinum
        else if (score >= 30) medalColor = '#ffd700'; // Gold
        else if (score >= 20) medalColor = '#c0c0c0'; // Silver
        else if (score >= 10) medalColor = '#cd7f32'; // Bronze

        if (medalColor) {
          ctx.beginPath();
          ctx.arc(boardX + 55, boardY + 85, 20, 0, Math.PI * 2);
          ctx.fillStyle = medalColor;
          ctx.fill();
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Star highlight on medal
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(boardX + 50, boardY + 78, 4, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Empty medal slot outline
          ctx.beginPath();
          ctx.arc(boardX + 55, boardY + 85, 20, 0, Math.PI * 2);
          ctx.strokeStyle = '#b5b078';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        // Play Again Button Badge
        const btnX = WIDTH / 2 - 50;
        const btnY = 345;
        ctx.fillStyle = '#f85800';
        ctx.fillRect(btnX, btnY, 100, 36);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(btnX, btnY, 100, 36);
        ctx.strokeRect(btnX - 2, btnY - 2, 104, 40);

        ctx.font = '11px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('PLAY', WIDTH / 2, btnY + 23);
      }
      ctx.restore();
    }

    function handleAction(e) {
      if (e) {
        if (e.type === 'keydown' && e.code !== 'Space') return;
        if (e.type === 'keydown') e.preventDefault();
      }

      AudioEngine.init();

      if (gameState === 'START') {
        gameState = 'PLAY';
        bird.flap();
      } else if (gameState === 'PLAY') {
        bird.flap();
      } else if (gameState === 'OVER') {
        bird.reset();
        pipes.reset();
        score = 0;
        gameState = 'START';
      }
    }

    window.addEventListener('keydown', handleAction);
    canvas.addEventListener('mousedown', handleAction);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleAction();
    }, { passive: false });

    function gameLoop() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      environment.update();
      bird.update();
      pipes.update();

      environment.draw();
      pipes.draw();
      bird.draw();
      drawScoreUI();

      frames++;
      requestAnimationFrame(gameLoop);
    }

    window.onload = () => {
      gameLoop();
    };
  </script>
</body>
</html>
