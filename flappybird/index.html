<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird Game</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #1a232a;
      font-family: Arial, sans-serif;
    }

    /* Top Left Home Button */
    .home-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #ff5216;
      color: #ffffff;
      text-decoration: none;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 1px;
      padding: 8px 18px 10px 14px;
      border-radius: 12px;
      border: 3px solid #000000;
      box-shadow: 0px 5px 0px #000000;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      cursor: pointer;
      user-select: none;
    }

    /* Hover & Click Effects */
    .home-btn:hover {
      background-color: #ff6832;
      transform: translateY(-2px);
      box-shadow: 0px 7px 0px #000000;
    }

    .home-btn:active {
      transform: translateY(3px);
      box-shadow: 0px 2px 0px #000000;
    }

    /* House Icon Styling */
    .home-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    canvas {
      border: 3px solid #000;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Home Button (Change href="/" to your website's main page URL) -->
  <a href="/games.html" class="home-btn">
    <svg viewBox="0 0 24 24">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    HOME
  </a>

  <canvas id="canvas" width="288" height="512"></canvas>

  <script src="flappyBird.js"></script>
</body>
</html>
