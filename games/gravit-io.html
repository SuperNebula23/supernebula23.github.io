<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravit-IO</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #05050d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 24px; text-shadow: 0 0 10px #8a2be2; }
        p { margin: 5px 0; font-size: 14px; opacity: 0.8; }
        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            min-width: 180px;
            z-index: 10;
        }
        #leaderboard ol { padding-left: 20px; margin: 5px 0 0 0; }
        
        /* Start Screen Modal */
        #start-modal {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 13, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.2);
        }
        input[type="text"] {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #8a2be2;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
            margin-bottom: 15px;
            width: 200px;
            text-align: center;
        }
        button {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #8a2be2, #4b0082);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #8a2be2;
        }
    </style>
    <!-- Serverless P2P Networking Library -->
    <script src="https://cdn.jsdelivr.net/npm/trystero@0.18.0/dist/trystero-torrent.min.js"></script>
</head>
<body>

    <!-- Start Overlay Screen -->
    <div id="start-modal">
        <div class="modal-box">
            <h1>GRAVIT-IO</h1>
            <p>Become the largest Singularity in the universe.</p>
            <br>
            <input type="text" id="username-input" placeholder="Enter Username" maxlength="12" value="Singularity">
            <br>
            <button id="start-btn">Join Game</button>
        </div>
    </div>

    <!-- In-Game UI -->
    <div id="ui">
        <h1>GRAVIT-IO</h1>
        <p>Mouse: Steer | Spacebar: Gravity Pulse</p>
        <p id="peer-count">Connecting...</p>
    </div>

    <div id="leaderboard">
        <strong>Top Singularities</strong>
        <ol id="scores"></ol>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Game Constants
    const WORLD_SIZE = 3000;
    const BOT_COUNT = 10;
    const FOOD_COUNT = 150;
    const MY_ID = Math.random().toString(36).substring(2, 9);
    
    let gameStarted = false;

    // Player State
    let me = {
        id: MY_ID,
        name: 'Player',
        x: Math.random() * (WORLD_SIZE - 400) + 200,
        y: Math.random() * (WORLD_SIZE - 400) + 200,
        vx: 0,
        vy: 0,
        radius: 25,
        color: `hsl(${Math.random() * 360}, 80%, 60%)`,
        alive: true
    };

    let players = {};
    let bots = [];
    let food = [];
    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };

    // Bot Names & Setup
    const botNames = ['Apex', 'Vortex', 'Cosmo', 'Nebula', 'Pulsar', 'Eclipse', 'Horizon', 'Quasar', 'Starlight', 'Nova'];

    function initBotsAndFood() {
        // Spawn Food
        for (let i = 0; i < FOOD_COUNT; i++) {
            food.push({
                x: Math.random() * WORLD_SIZE,
                y: Math.random() * WORLD_SIZE,
                color: `hsl(${Math.random() * 360}, 70%, 70%)`
            });
        }

        // Spawn Bots
        for (let i = 0; i < BOT_COUNT; i++) {
            bots.push({
                id: 'bot_' + i,
                name: botNames[i % botNames.length],
                x: Math.random() * (WORLD_SIZE - 400) + 200,
                y: Math.random() * (WORLD_SIZE - 400) + 200,
                vx: 0,
                vy: 0,
                radius: Math.random() * 15 + 20,
                color: `hsl(${Math.random() * 360}, 60%, 50%)`,
                targetX: Math.random() * WORLD_SIZE,
                targetY: Math.random() * WORLD_SIZE
            });
        }
    }

    // P2P Networking
    const config = { appId: 'gravit-io-game-2026' };
    const room = joinRoom(config, 'global-room');
    const [sendMove, getMove] = room.makeAction('move');

    document.getElementById('peer-count').innerText = "Network Ready (P2P Enabled)";

    room.onPeerJoin(peerId => {
        document.getElementById('peer-count').innerText = `Live Players: ${Object.keys(players).length + 1}`;
    });

    room.onPeerLeave(peerId => {
        delete players[peerId];
        document.getElementById('peer-count').innerText = `Live Players: ${Object.keys(players).length + 1}`;
    });

    getMove((data, peerId) => {
        players[peerId] = data;
    });

    // Start Button Handler
    document.getElementById('start-btn').addEventListener('click', () => {
        const input = document.getElementById('username-input').value.trim();
        if (input) me.name = input;
        document.getElementById('start-modal').style.display = 'none';
        gameStarted = true;
    });

    // Input Events
    window.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    window.addEventListener('keydown', e => {
        if (e.code === 'Space' && me.alive && me.radius > 15) {
            // Gravity Pulse Mechanic: Repel & Accelerate
            me.vx += (mouse.x - canvas.width / 2) * 0.05;
            me.vy += (mouse.y - canvas.height / 2) * 0.05;
            me.radius -= 1; // Costs mass to pulse
        }
    });

    // Main Update Function
    function update() {
        if (!gameStarted) return;

        // --- 1. LOCAL PLAYER PHYSICS ---
        if (me.alive) {
            const dx = mouse.x - canvas.width / 2;
            const dy = mouse.y - canvas.height / 2;
            const dist = Math.hypot(dx, dy);

            if (dist > 10) {
                me.vx += (dx / dist) * 0.2;
                me.vy += (dy / dist) * 0.2;
            }

            me.vx *= 0.96;
            me.vy *= 0.96;
            me.x += me.vx;
            me.y += me.vy;

            // World Boundaries
            me.x = Math.max(me.radius, Math.min(WORLD_SIZE - me.radius, me.x));
            me.y = Math.max(me.radius, Math.min(WORLD_SIZE - me.radius, me.y));

            // Eat Food
            for (let i = food.length - 1; i >= 0; i--) {
                let f = food[i];
                if (Math.hypot(f.x - me.x, f.y - me.y) < me.radius) {
                    me.radius += 0.3;
                    food[i] = { x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE, color: f.color };
                }
            }
        }

        // --- 2. BOTS AI & MOVEMENT ---
        bots.forEach(bot => {
            // AI behavior: Chase nearest smaller entity or food
            let closestTarget = null;
            let closestDist = 9999;

            // Look for food
            food.forEach(f => {
                let d = Math.hypot(f.x - bot.x, f.y - bot.y);
                if (d < closestDist) {
                    closestDist = d;
                    closestTarget = f;
                }
            });

            // If player is smaller and close, chase player instead
            if (me.alive && me.radius < bot.radius && Math.hypot(me.x - bot.x, me.y - bot.y) < 400) {
                closestTarget = me;
            }

            if (closestTarget) {
                let bdx = closestTarget.x - bot.x;
                let bdy = closestTarget.y - bot.y;
                let bdist = Math.hypot(bdx, bdy);
                if (bdist > 5) {
                    bot.vx += (bdx / bdist) * 0.15;
                    bot.vy += (bdy / bdist) * 0.15;
                }
            }

            bot.vx *= 0.96;
            bot.vy *= 0.96;
            bot.x += bot.vx;
            bot.y += bot.vy;

            // Clamp inside world
            bot.x = Math.max(bot.radius, Math.min(WORLD_SIZE - bot.radius, bot.x));
            bot.y = Math.max(bot.radius, Math.min(WORLD_SIZE - bot.radius, bot.y));

            // Bot Eats Food
            for (let i = food.length - 1; i >= 0; i--) {
                let f = food[i];
                if (Math.hypot(f.x - bot.x, f.y - bot.y) < bot.radius) {
                    bot.radius += 0.3;
                    food[i] = { x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE, color: f.color };
                }
            }

            // --- 3. GRAVITY & EATING INTERACTIONS (Player <-> Bot) ---
            if (me.alive) {
                let pdx = bot.x - me.x;
                let pdy = bot.y - me.y;
                let pdist = Math.hypot(pdx, pdy);

                if (pdist < me.radius + bot.radius + 150 && pdist > 0) {
                    // Gravitational Pull
                    let force = (bot.radius / (pdist * 0.5));
                    if (me.radius < bot.radius) {
                        me.vx += (pdx / pdist) * force;
                        me.vy += (pdy / pdist) * force;
                    } else {
                        bot.vx -= (pdx / pdist) * force;
                        bot.vy -= (pdy / pdist) * force;
                    }

                    // Eating Condition
                    if (pdist < Math.max(me.radius, bot.radius)) {
                        if (me.radius > bot.radius * 1.1) {
                            // Player eats bot
                            me.radius += bot.radius * 0.4;
                            respawnBot(bot);
                        } else if (bot.radius > me.radius * 1.1) {
                            // Bot eats player
                            bot.radius += me.radius * 0.4;
                            me.alive = false;
                            setTimeout(() => alert("Your singularity collapsed! Refresh to play again."), 100);
                        }
                    }
                }
            }
        });

        // Broadcast local position to remote peers
        if (me.alive) {
            sendMove({
                x: me.x,
                y: me.y,
                radius: me.radius,
                color: me.color,
                name: me.name
            });
        }

        updateLeaderboard();
    }

    function respawnBot(bot) {
        bot.x = Math.random() * (WORLD_SIZE - 400) + 200;
        bot.y = Math.random() * (WORLD_SIZE - 400) + 200;
        bot.radius = Math.random() * 15 + 20;
    }

    // Leaderboard Update
    function updateLeaderboard() {
        let allEntities = [];
        if (me.alive) allEntities.push({ name: me.name, score: Math.floor(me.radius) });
        
        bots.forEach(b => allEntities.push({ name: b.name, score: Math.floor(b.radius) }));
        for (let id in players) {
            if (players[id].name) allEntities.push({ name: players[id].name, score: Math.floor(players[id].radius) });
        }

        allEntities.sort((a, b) => b.score - a.score);

        const list = document.getElementById('scores');
        list.innerHTML = '';
        allEntities.slice(0, 5).forEach(e => {
            let li = document.createElement('li');
            li.innerText = `${e.name}: ${e.score}`;
            list.appendChild(li);
        });
    }

    // Render Loop
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameStarted) {
            ctx.save();
            // Camera tracks player (or center if dead)
            let camX = me.alive ? me.x : WORLD_SIZE / 2;
            let camY = me.alive ? me.y : WORLD_SIZE / 2;
            ctx.translate(canvas.width / 2 - camX, canvas.height / 2 - camY);

            // Draw World Boundary
            ctx.strokeStyle = '#8a2be2';
            ctx.lineWidth = 5;
            ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

            // Draw Space Grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 2;
            for (let x = 0; x < WORLD_SIZE; x += 100) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); ctx.stroke();
            }
            for (let y = 0; y < WORLD_SIZE; y += 100) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); ctx.stroke();
            }

            // Draw Space Food
            food.forEach(f => {
                ctx.beginPath();
                ctx.arc(f.x, f.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = f.color;
                ctx.fill();
            });

            // Draw Remote Players
            for (let id in players) {
                let p = players[id];
                drawBlackHole(p.x, p.y, p.radius, p.color, p.name);
            }

            // Draw AI Bots
            bots.forEach(b => {
                drawBlackHole(b.x, b.y, b.radius, b.color, b.name);
            });

            // Draw Local Player
            if (me.alive) {
                drawBlackHole(me.x, me.y, me.radius, me.color, me.name);
            }

            ctx.restore();
        }

        requestAnimationFrame(() => {
            update();
            draw();
        });
    }

    function drawBlackHole(x, y, radius, color, name) {
        // Gravitational Distortion Field
        ctx.beginPath();
        ctx.arc(x, y, radius + 15, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.2;
        ctx.fill();
        ctx.globalAlpha = 1.0;

        // Core Event Horizon
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#000000';
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.fill();
        ctx.stroke();

        // Username Label
        ctx.fillStyle = '#ffffff';
        ctx.font = '12px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(name || 'Unknown', x, y - radius - 10);
    }

    initBotsAndFood();
    draw();

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
</script>
</body>
</html>
