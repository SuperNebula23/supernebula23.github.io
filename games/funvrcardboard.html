<!DOCTYPE html>
<html>
  <head>
    <title>3-Letter Code VR Multiplayer</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
      /* Fullscreen Lobby Menu */
      #lobby {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0d0e15;
        color: #00ffcc;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        background: #161824;
        border: 2px solid #00ffcc;
        border-radius: 12px;
        padding: 24px;
        text-align: center;
        max-width: 320px;
        width: 100%;
        box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
      }
      .code-display { font-size: 32px; font-weight: bold; letter-spacing: 4px; color: #ff00ff; margin: 10px 0; }
      input {
        width: 80%;
        padding: 10px;
        font-size: 20px;
        text-align: center;
        text-transform: uppercase;
        background: #0d0e15;
        color: #00ffcc;
        border: 1px solid #00ffcc;
        border-radius: 6px;
        margin: 10px 0;
      }
      button {
        width: 90%;
        padding: 12px;
        font-size: 16px;
        font-weight: bold;
        background: #00ffcc;
        color: #0d0e15;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 8px;
      }
      #motion-status {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 8px 16px;
        font-family: sans-serif;
        border-radius: 20px;
        font-size: 14px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>

    <!-- 2D LOBBY MENU OVERLAY -->
    <div id="lobby">
      <div class="card">
        <h2>3D VR LOBBY</h2>
        <div>YOUR ROOM CODE:</div>
        <div id="my-code" class="code-display">---</div>
        
        <hr style="border-color: #333; margin: 15px 0;" />
        
        <input type="text" id="remote-code" maxlength="3" placeholder="3-LETTER CODE" />
        <button onclick="connectToPeer()">CONNECT TO FRIEND</button>
        
        <div id="status" style="color: #00ffaa; margin: 10px 0; font-weight: bold;"></div>
        
        <button id="vr-btn" onclick="startVR()" style="background: #ff00ff; color: white;">ENTER VR MODE</button>
      </div>
    </div>

    <!-- On-screen movement indicator -->
    <div id="motion-status">Movement: <b id="move-state" style="color: #00ffaa;">MOVING</b> (Look down to toggle)</div>

    <!-- 3D SCENE -->
    <a-scene embedded="false">
      <a-sky color="#050510"></a-sky>
      <a-light type="ambient" color="#443366"></a-light>
      <a-light type="directional" position="-1 2 1" intensity="0.8" color="#00ffff"></a-light>

      <!-- Neon Island Floor -->
      <a-cylinder position="0 -0.5 0" radius="10" height="1" color="#121225"></a-cylinder>
      <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="9.8" radius-outer="10" color="#00ffcc"></a-ring>
      
      <!-- Glowing Center Beacon -->
      <a-octahedron position="0 2.5 0" radius="1.2" color="#ff00ff"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
      </a-octahedron>

      <!-- Camera Rig -->
      <a-entity id="camera-rig" position="0 0 5">
        <a-camera id="local-camera" look-controls>
          <a-cursor
            id="cursor"
            fuse="true"
            fuse-timeout="1200"
            color="#00ffcc"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
            animation__fusing="property: scale; startEvents: fusing; dur: 1200; from: 1 1 1; to: 0.2 0.2 0.2"
            animation__mouseleave="property: scale; startEvents: mouseleave; dur: 150; to: 1 1 1">
          </a-cursor>
        </a-camera>
      </a-entity>

      <!-- REMOTE PLAYER AVATAR WITH NAMETAG -->
      <a-entity id="remote-avatar" visible="false">
        <!-- Floating Nametag above head -->
        <a-text
          id="remote-nametag"
          value="P2"
          position="0 2.2 0"
          align="center"
          color="#00FFCC"
          scale="1.5 1.5 1.5"
          side="double">
        </a-text>

        <!-- Avatar body -->
        <a-cone color="#ff00aa" radius-bottom="0.4" radius-top="0" height="1.2" position="0 1 0"></a-cone>
        <a-sphere color="#00ffcc" radius="0.25" position="0 1.6 0"></a-sphere>
      </a-entity>
    </a-scene>

    <script>
      // Generate short 3-letter room code (e.g. "A7X")
      function generateShortCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let code = '';
        for (let i = 0; i < 3; i++) {
          code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
      }

      const myCode = generateShortCode();
      document.getElementById('my-code').innerText = myCode;

      // Initialize PeerJS with the short 3-letter ID
      const peer = new Peer(myCode);
      let conn = null;

      peer.on('open', (id) => { console.log('My Peer Code:', id); });
      peer.on('connection', (connection) => {
        conn = connection;
        setupConnection();
      });

      function connectToPeer() {
        const destCode = document.getElementById('remote-code').value.toUpperCase().trim();
        if (destCode.length !== 3) {
          alert('Please enter a valid 3-character code!');
          return;
        }
        conn = peer.connect(destCode);
        setupConnection();
      }

      function setupConnection() {
        conn.on('open', () => {
          document.getElementById('status').innerText = "CONNECTED TO FRIEND!";
          document.getElementById('remote-avatar').setAttribute('visible', 'true');
          
          // Set remote nametag text to friend's code
          document.getElementById('remote-nametag').setAttribute('value', conn.peer);
          
          setInterval(sendTransform, 50); // 20 updates per sec
        });

        conn.on('data', (data) => {
          const avatar = document.getElementById('remote-avatar');
          if (data.pos) avatar.setAttribute('position', data.pos);
          if (data.rot) avatar.setAttribute('rotation', data.rot);
        });
      }

      function sendTransform() {
        if (!conn || !conn.open) return;
        const rigPos = document.getElementById('camera-rig').getAttribute('position');
        const camRot = document.getElementById('local-camera').getAttribute('rotation');
        conn.send({
          pos: `${rigPos.x} ${rigPos.y} ${rigPos.z}`,
          rot: `${camRot.x} ${camRot.y} ${camRot.z}`
        });
      }

      // Hide 2D Lobby and enter Cardboard VR Mode
      function startVR() {
        document.getElementById('lobby').style.display = 'none';
        const scene = document.querySelector('a-scene');
        if (scene.enterVR) {
          scene.enterVR(); // Triggers split-screen Cardboard VR mode
        }
      }

      // ================= GAZE MOVEMENT =================
      const cameraRig = document.getElementById('camera-rig');
      const localCamera = document.getElementById('local-camera');
      const moveStateEl = document.getElementById('move-state');

      let isMoving = true;
      let canToggle = true;
      const MOVE_SPEED = 0.05;

      AFRAME.registerComponent('gaze-steering', {
        tick: function () {
          if (!localCamera) return;
          const rotation = localCamera.getAttribute('rotation');
          const pitch = rotation.x;
          const yaw = rotation.y;

          // Look down threshold to pause/resume
          if (pitch < -45) {
            if (canToggle) {
              isMoving = !isMoving;
              canToggle = false;
              moveStateEl.innerText = isMoving ? "MOVING" : "PAUSED";
              moveStateEl.style.color = isMoving ? "#00ffaa" : "#ff3366";
            }
          } else if (pitch > -30) {
            canToggle = true;
          }

          if (isMoving) {
            const yawRad = THREE.MathUtils.degToRad(yaw);
            const currentPos = cameraRig.getAttribute('position');
            currentPos.x -= Math.sin(yawRad) * MOVE_SPEED;
            currentPos.z -= Math.cos(yawRad) * MOVE_SPEED;
            cameraRig.setAttribute('position', currentPos);
          }
        }
      });

      document.querySelector('a-scene').setAttribute('gaze-steering', '');
    </script>
  </body>
</html>
