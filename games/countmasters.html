<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Count Masters 3D - Easy & Fun God Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            background-color: #0f172a;
            font-family: 'Fredoka One', cursive, 'Inter', sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .ui-overlay {
            pointer-events: none;
        }
        .ui-interactive {
            pointer-events: auto;
        }
    </style>
</head>
<body class="w-full h-full relative overflow-hidden bg-slate-900">

    <!-- 3D Canvas -->
    <div id="canvas-container" class="w-full h-full absolute inset-0"></div>

    <!-- HUD & UI Overlay -->
    <div class="ui-overlay fixed inset-0 flex flex-col justify-between p-4 z-10">
        <!-- Top Header -->
        <div class="flex justify-between items-center w-full max-w-md mx-auto mt-2 px-2">
            <div class="bg-slate-800/90 backdrop-blur-md px-4 py-2 rounded-full border border-slate-700 shadow-xl text-white">
                <span class="text-[10px] text-slate-400 uppercase tracking-wider block leading-none mb-1">Level</span>
                <span id="level-display" class="text-xl font-extrabold text-cyan-400 leading-none">1</span>
            </div>

            <!-- Coins -->
            <div class="bg-slate-800/90 backdrop-blur-md px-4 py-2 rounded-full border border-slate-700 shadow-xl text-white flex items-center space-x-2">
                <span class="text-xl">🪙</span>
                <span id="total-coins-display" class="text-xl font-extrabold text-yellow-400 leading-none">0</span>
            </div>
            
            <div class="bg-slate-800/90 backdrop-blur-md px-5 py-2 rounded-full border border-slate-700 shadow-xl text-white flex items-center space-x-2">
                <span class="text-[10px] text-slate-400 uppercase tracking-wider">Crowd</span>
                <span id="crowd-count-display" class="text-2xl font-black text-amber-400 leading-none">20</span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full max-w-md mx-auto my-2 px-2">
            <div class="w-full bg-slate-800/80 rounded-full h-3 border border-slate-700 p-0.5 overflow-hidden shadow-inner">
                <div id="progress-bar" class="bg-gradient-to-r from-cyan-500 to-blue-500 h-full rounded-full w-0 transition-all duration-100"></div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="ui-interactive fixed inset-0 flex flex-col items-center justify-center bg-black/50 backdrop-blur-sm z-20 transition-opacity duration-300 p-4">
            <div class="text-center p-6 bg-slate-800/95 rounded-3xl border border-slate-700 shadow-2xl max-w-xs w-full transform hover:scale-105 transition-transform">
                <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">COUNT MASTERS</h1>
                <p class="text-slate-300 text-xs mb-4 leading-relaxed">God Mode Active! Build a massive swarm and obliterate everything in your path!</p>
                <button id="start-btn" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-lg font-bold rounded-2xl shadow-lg shadow-cyan-500/30 active:scale-95 transition-all">
                    TAP TO CRUSH IT
                </button>
            </div>
        </div>

        <!-- Game Over / Victory Modal -->
        <div id="end-modal" class="ui-interactive hidden fixed inset-0 flex flex-col items-center justify-center bg-black/60 backdrop-blur-md z-30 p-4">
            <div class="text-center p-6 bg-slate-800/95 rounded-3xl border border-slate-700 shadow-2xl max-w-xs w-full">
                <h2 id="modal-title" class="text-3xl font-black text-amber-400 mb-2">VICTORY!</h2>
                <p id="modal-sub" class="text-slate-300 text-sm mb-4">You dominated the course!</p>
                
                <div id="earnings-container" class="bg-slate-900/80 p-3 rounded-2xl border border-slate-700 mb-6 text-left space-y-1">
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>Surviving Runners:</span>
                        <span id="finish-runners-count" class="font-bold text-cyan-400">0</span>
                    </div>
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>Stair Multiplier:</span>
                        <span id="finish-multiplier" class="font-bold text-amber-400">1x</span>
                    </div>
                    <hr class="border-slate-800 my-1">
                    <div class="flex justify-between text-sm font-bold text-white">
                        <span>Earned Coins:</span>
                        <span id="earned-coins" class="text-yellow-400">+0 🪙</span>
                    </div>
                </div>

                <button id="restart-btn" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white text-lg font-bold rounded-2xl shadow-lg shadow-emerald-500/30 active:scale-95 transition-all">
                    NEXT LEVEL
                </button>
            </div>
        </div>
    </div>

    <script>
        class SoundSystem {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playGatePass() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1046.50, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.15);
            }
            playPop() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            }
            playFall() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(280, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.25);
            }
            playWin() {
                if (!this.ctx) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.25);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.1);
                    osc.stop(this.ctx.currentTime + idx * 0.1 + 0.25);
                });
            }
            playLose() {
                if (!this.ctx) return;
                [400, 350, 300, 220].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.12);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.12 + 0.2);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.12);
                    osc.stop(this.ctx.currentTime + idx * 0.12 + 0.2);
                });
            }
        }
        const audio = new SoundSystem();

        let scene, camera, renderer;
        let blueMaterial, redMaterial, trackMaterial, bridgeMaterial;
        
        let gameState = 'START';
        let currentLevel = 1;
        let totalCoins = 0;
        let levelLength = 350;
        let forwardSpeed = 0.20;
        let playerX = 0;
        let playerZ = 0;
        let targetPlayerX = 0;
        let finishClimbTimer = 0;
        let highestStairReached = 1;

        let isPointerDown = false;
        let pointerStartX = 0;
        let playerStartX = 0;
        let keyLeft = false;
        let keyRight = false;

        let crowdMembers = [];
        let fallingRunners = [];
        let enemyGroups = [];
        let gateEntities = [];
        let obstacleEntities = [];
        let bridgeSections = [];
        let finishStairs = [];
        let particleSystems = [];
        let trackMeshes = [];

        function createSmoothCapsuleGeometry(radius, length) {
            const group = new THREE.Group();
            const cylinderGeo = new THREE.CylinderGeometry(radius, radius, length, 12, 1, true);
            const cylinder = new THREE.Mesh(cylinderGeo);
            group.add(cylinder);

            const topSphereGeo = new THREE.SphereGeometry(radius, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2);
            const topCap = new THREE.Mesh(topSphereGeo);
            topCap.position.y = length / 2;
            group.add(topCap);

            const botSphereGeo = new THREE.SphereGeometry(radius, 12, 8, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
            const botCap = new THREE.Mesh(botSphereGeo);
            botCap.position.y = -length / 2;
            group.add(botCap);

            return group;
        }

        function createCharacterMesh(material) {
            const runnerGroup = new THREE.Group();

            const headGeo = new THREE.SphereGeometry(0.40, 16, 16);
            headGeo.scale(1.0, 1.15, 1.0);
            const head = new THREE.Mesh(headGeo, material);
            head.position.y = 1.45;
            head.castShadow = true;
            runnerGroup.add(head);

            const torsoContainer = createSmoothCapsuleGeometry(0.24, 0.38);
            torsoContainer.children.forEach(mesh => { mesh.material = material; mesh.castShadow = true; });
            torsoContainer.position.y = 0.85;
            runnerGroup.add(torsoContainer);

            const createLimbMesh = (r, l) => {
                const limbGroup = createSmoothCapsuleGeometry(r, l);
                limbGroup.children.forEach(m => { m.material = material; m.castShadow = true; });
                return limbGroup;
            };

            const leftLegPivot = new THREE.Group(); leftLegPivot.position.set(-0.16, 0.58, 0);
            const leftLegMesh = createLimbMesh(0.12, 0.35); leftLegMesh.position.y = -0.20;
            leftLegPivot.add(leftLegMesh); runnerGroup.add(leftLegPivot);

            const rightLegPivot = new THREE.Group(); rightLegPivot.position.set(0.16, 0.58, 0);
            const rightLegMesh = createLimbMesh(0.12, 0.35); rightLegMesh.position.y = -0.20;
            rightLegPivot.add(rightLegMesh); runnerGroup.add(rightLegPivot);

            const leftArmPivot = new THREE.Group(); leftArmPivot.position.set(-0.28, 0.98, 0);
            const leftArmMesh = createLimbMesh(0.11, 0.32); leftArmMesh.position.y = -0.18;
            leftArmPivot.add(leftArmMesh); leftArmPivot.rotation.z = Math.PI / 6;
            runnerGroup.add(leftArmPivot);

            const rightArmPivot = new THREE.Group(); rightArmPivot.position.set(0.28, 0.98, 0);
            const rightArmMesh = createLimbMesh(0.11, 0.32); rightArmMesh.position.y = -0.18;
            rightArmPivot.add(rightArmMesh); rightArmPivot.rotation.z = -Math.PI / 6;
            runnerGroup.add(rightArmPivot);

            runnerGroup.userData = {
                leftLeg: leftLegPivot, rightLeg: rightLegPivot,
                leftArm: leftArmPivot, rightArm: rightArmPivot,
                head: head, animOffset: Math.random() * Math.PI * 2
            };

            return runnerGroup;
        }

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xbae6fd);
            scene.fog = new THREE.FogExp2(0xbae6fd, 0.005);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 400);
            camera.position.set(0, 8, -12);
            camera.lookAt(0, 1.5, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
            dirLight.position.set(20, 40, -20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 250;
            const d = 40;
            dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            blueMaterial = new THREE.MeshPhongMaterial({ color: 0x0284c7, shininess: 90, specular: 0x38bdf8 });
            redMaterial = new THREE.MeshPhongMaterial({ color: 0xe11d48, shininess: 90, specular: 0xf43f5e });
            trackMaterial = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.8 });
            bridgeMaterial = new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.6 });

            setupLevel();
            setupControls();
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function createGateTexture(label, isPositive) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 384;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            if (isPositive) {
                grad.addColorStop(0, '#0284c7'); grad.addColorStop(1, '#0369a1');
            } else {
                grad.addColorStop(0, '#f43f5e'); grad.addColorStop(1, '#be123c');
            }
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.lineWidth = 16;
            ctx.strokeStyle = '#ffffff';
            ctx.strokeRect(16, 16, canvas.width - 32, canvas.height - 32);

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 110px "Fredoka One", "Inter", sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;

            ctx.fillText(label, canvas.width / 2, canvas.height / 2);
            return new THREE.CanvasTexture(canvas);
        }

        function disposeHierarchy(parent) {
            while (parent.children.length > 0) {
                const child = parent.children[0];
                if (child.children && child.children.length > 0) disposeHierarchy(child);
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
                    } else {
                        if (child.material.map) child.material.map.dispose();
                        child.material.dispose();
                    }
                }
                parent.remove(child);
            }
        }

        function clearSceneEntities() {
            crowdMembers.forEach(m => { disposeHierarchy(m.mesh); scene.remove(m.mesh); });
            crowdMembers = [];

            fallingRunners.forEach(fr => { disposeHierarchy(fr.mesh); scene.remove(fr.mesh); });
            fallingRunners = [];

            enemyGroups.forEach(eg => { disposeHierarchy(eg.group); scene.remove(eg.group); });
            enemyGroups = [];

            gateEntities.forEach(g => { disposeHierarchy(g.group); scene.remove(g.group); });
            gateEntities = [];

            obstacleEntities.forEach(o => { disposeHierarchy(o.mesh); scene.remove(o.mesh); });
            obstacleEntities = [];

            finishStairs.forEach(s => { disposeHierarchy(s.mesh); scene.remove(s.mesh); });
            finishStairs = [];

            particleSystems.forEach(p => { disposeHierarchy(p.mesh); scene.remove(p.mesh); });
            particleSystems = [];

            trackMeshes.forEach(tm => { disposeHierarchy(tm); scene.remove(tm); });
            trackMeshes = [];
            bridgeSections = [];
        }

        function buildTrackPiece(startZ, length, width, isBridge = false) {
            const trackGeo = new THREE.BoxGeometry(width, 1, length);
            const mat = isBridge ? bridgeMaterial : trackMaterial;
            const mesh = new THREE.Mesh(trackGeo, mat);
            mesh.position.set(0, -0.5, startZ + length / 2);
            mesh.receiveShadow = true;
            scene.add(mesh);
            trackMeshes.push(mesh);

            if (!isBridge) {
                const railGeo = new THREE.BoxGeometry(0.4, 0.6, length);
                const railMat = new THREE.MeshPhongMaterial({ color: 0x38bdf8 });
                const leftRail = new THREE.Mesh(railGeo, railMat);
                leftRail.position.set(-width / 2 - 0.2, 0.3, startZ + length / 2);
                scene.add(leftRail); trackMeshes.push(leftRail);

                const rightRail = new THREE.Mesh(railGeo, railMat);
                rightRail.position.set(width / 2 + 0.2, 0.3, startZ + length / 2);
                scene.add(rightRail); trackMeshes.push(rightRail);
            } else {
                bridgeSections.push({
                    startZ: startZ,
                    endZ: startZ + length,
                    halfWidth: width / 2 - 0.2
                });
            }
        }

        function setupLevel() {
            clearSceneEntities();

            playerX = 0; playerZ = 0; targetPlayerX = 0;
            finishClimbTimer = 0; highestStairReached = 1;

            levelLength = 320 + (currentLevel * 30);
            forwardSpeed = 0.20 + Math.min(0.06, (currentLevel - 1) * 0.01);

            // Wide tracks, ultra forgiving
            const trackWidth = 14.0;
            const bridgeChance = currentLevel < 4 ? 0 : 0.15;

            let zCursor = 0;
            while (zCursor < levelLength) {
                if (zCursor > 60 && Math.random() < bridgeChance && zCursor < levelLength - 80) {
                    buildTrackPiece(zCursor, 25, 7.0, true);
                    zCursor += 25;
                } else {
                    buildTrackPiece(zCursor, 50, trackWidth, false);
                    zCursor += 50;
                }
            }
            buildTrackPiece(levelLength, 40, trackWidth, false);

            // START WITH A BIG SWARM!
            for (let i = 0; i < 20; i++) {
                addCrowdMember((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2);
            }

            // EASY PROCEDURAL GENERATION
            let currentZ = 40;
            while (currentZ < levelLength - 50) {
                let randType = Math.random();

                if (randType < 0.6) {
                    spawnProceduralGatePair(currentZ);
                    currentZ += 32;
                } else if (randType < 0.8) {
                    spawnSawBlade(currentZ);
                    currentZ += 32;
                } else {
                    // Very tiny enemy groups that get completely overrun
                    const enemyCount = Math.min(3, 1 + Math.floor(currentLevel * 0.5));
                    spawnEnemyGroup(currentZ, enemyCount);
                    currentZ += 32;
                }
            }

            spawnFinishStaircase(levelLength);
            updateCrowdDisplay();
        }

        function spawnProceduralGatePair(zPos) {
            const gateGroup = new THREE.Group();
            gateGroup.position.z = zPos;

            // MASSIVE MULTIPLIERS AND HUGE PLUS GATES
            let leftOp = Math.random() > 0.3 ? '+' : '*';
            let rightOp = Math.random() > 0.3 ? '+' : '*';

            let leftVal = leftOp === '+' ? Math.floor(20 + Math.random() * 30) : 3;
            let rightVal = rightOp === '+' ? Math.floor(15 + Math.random() * 25) : 2;

            const leftData = { text: `${leftOp}${leftVal}`, val: leftVal, op: leftOp };
            const rightData = { text: `${rightOp}${rightVal}`, val: rightVal, op: rightOp };

            const leftTex = createGateTexture(leftData.text, true);
            const leftMat = new THREE.MeshBasicMaterial({ map: leftTex, transparent: true, side: THREE.DoubleSide });
            const leftMesh = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 3.2), leftMat);
            leftMesh.position.set(-2.8, 2.0, 0);
            leftMesh.rotation.y = Math.PI;
            gateGroup.add(leftMesh);

            const rightTex = createGateTexture(rightData.text, true);
            const rightMat = new THREE.MeshBasicMaterial({ map: rightTex, transparent: true, side: THREE.DoubleSide });
            const rightMesh = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 3.2), rightMat);
            rightMesh.position.set(2.8, 2.0, 0);
            rightMesh.rotation.y = Math.PI;
            gateGroup.add(rightMesh);

            scene.add(gateGroup);
            gateEntities.push({
                group: gateGroup, z: zPos, passed: false, leftData: leftData, rightData: rightData
            });
        }

        function spawnSawBlade(zPos) {
            const sawGroup = new THREE.Group();
            sawGroup.position.set(0, 0.8, zPos);

            const discGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.08, 24);
            const discMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.9, roughness: 0.1 });
            const disc = new THREE.Mesh(discGeo, discMat);
            disc.rotation.x = Math.PI / 2;
            disc.castShadow = true;
            sawGroup.add(disc);

            scene.add(sawGroup);
            obstacleEntities.push({
                mesh: sawGroup, z: zPos, type: 'SAW',
                dir: Math.random() > 0.5 ? 1 : -1,
                speed: 0.02
            });
        }

        function spawnEnemyGroup(zPos, count) {
            const members = [];
            const enemyCenter = new THREE.Group();
            enemyCenter.position.set(0, 0, zPos);

            for (let i = 0; i < count; i++) {
                const mesh = createCharacterMesh(redMaterial);
                const angle = i * 0.7;
                const r = 0.4 * Math.sqrt(i);
                mesh.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
                enemyCenter.add(mesh);
                members.push({ mesh: mesh });
            }

            scene.add(enemyCenter);
            enemyGroups.push({ group: enemyCenter, z: zPos, members: members, active: true });
        }

        function spawnFinishStaircase(startZ) {
            const colors = [0xef4444, 0xf97316, 0xeab308, 0x22c55e, 0x06b6d4, 0x3b82f6, 0xa855f7, 0xec4899, 0x10b981, 0x6366f1];
            
            for (let i = 0; i < 10; i++) {
                const mult = i + 1;
                const stairGeo = new THREE.BoxGeometry(12, 0.8 * mult, 3.5);
                const stairMat = new THREE.MeshPhongMaterial({ color: colors[i % colors.length] });

                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 256;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 512, 256);
                ctx.translate(256, 128); ctx.scale(-1, -1);
                ctx.fillStyle = '#0f172a'; ctx.font = '900 130px "Fredoka One", sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(`${mult}x`, 0, 0);

                const tex = new THREE.CanvasTexture(canvas);
                const stepFaceMat = new THREE.MeshBasicMaterial({ map: tex });
                const faceMaterials = [stairMat, stairMat, stairMat, stairMat, stairMat, stepFaceMat];

                const stair = new THREE.Mesh(stairGeo, faceMaterials);
                stair.position.set(0, (0.8 * mult) / 2, startZ + i * 3.5);
                stair.receiveShadow = true;

                scene.add(stair);
                finishStairs.push({ mesh: stair, mult: mult });
            }
        }

        function addCrowdMember(offsetX, offsetZ) {
            const mesh = createCharacterMesh(blueMaterial);
            mesh.position.set(playerX + offsetX, 0, playerZ + offsetZ);
            scene.add(mesh);
            crowdMembers.push({ mesh: mesh, offsetX: offsetX, offsetZ: offsetZ });
        }

        function updateCrowdPositions() {
            const spacing = 0.45;
            crowdMembers.forEach((m, idx) => {
                if (idx === 0) {
                    m.offsetX = 0; m.offsetZ = 0;
                } else {
                    const phi = idx * 137.5 * (Math.PI / 180);
                    const r = spacing * Math.sqrt(idx);
                    m.offsetX = r * Math.cos(phi);
                    m.offsetZ = r * Math.sin(phi);
                }

                const targetX = playerX + m.offsetX;
                const targetZ = playerZ + m.offsetZ;

                m.mesh.position.x += (targetX - m.mesh.position.x) * 0.25;
                m.mesh.position.z += (targetZ - m.mesh.position.z) * 0.25;

                if (gameState === 'PLAYING' || gameState === 'FINISH_RUN') {
                    const ud = m.mesh.userData;
                    const time = Date.now() * 0.012 + ud.animOffset;
                    ud.leftLeg.rotation.x = Math.sin(time) * 0.75;
                    ud.rightLeg.rotation.x = -Math.sin(time) * 0.75;
                    ud.leftArm.rotation.x = -Math.sin(time) * 0.75;
                    ud.rightArm.rotation.x = Math.sin(time) * 0.75;
                    
                    if (gameState === 'PLAYING') {
                        m.mesh.position.y = Math.abs(Math.sin(time * 2)) * 0.12;
                    }
                }
            });

            updateCrowdDisplay();
        }

        function updateCrowdDisplay() {
            document.getElementById('crowd-count-display').innerText = crowdMembers.length;
        }

        function applyGateEffect(gateData) {
            let currentCount = crowdMembers.length;
            let targetCount = currentCount;

            if (gateData.op === '+') targetCount = currentCount + gateData.val;
            if (gateData.op === '*') targetCount = currentCount * gateData.val;

            const diff = Math.min(100, targetCount - currentCount); // Cap added runners so browser doesn't lag

            if (diff > 0) {
                for (let i = 0; i < diff; i++) {
                    addCrowdMember((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2);
                }
            }

            audio.playGatePass();
        }

        function spawnPopParticles(pos, colorHex) {
            const count = 4;
            const pGroup = new THREE.Group();
            pGroup.position.copy(pos);
            const mat = new THREE.MeshBasicMaterial({ color: colorHex });

            const particles = [];
            for (let i = 0; i < count; i++) {
                const pMesh = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), mat);
                pMesh.userData = {
                    vx: (Math.random() - 0.5) * 0.2,
                    vy: Math.random() * 0.2 + 0.1,
                    vz: (Math.random() - 0.5) * 0.2
                };
                pGroup.add(pMesh);
                particles.push(pMesh);
            }

            scene.add(pGroup);
            particleSystems.push({ mesh: pGroup, particles: particles, life: 1.0 });
        }

        function setupControls() {
            window.addEventListener('pointerdown', (e) => {
                if (gameState !== 'PLAYING') return;
                isPointerDown = true;
                pointerStartX = e.clientX;
                playerStartX = targetPlayerX;
            });

            window.addEventListener('pointermove', (e) => {
                if (!isPointerDown || gameState !== 'PLAYING') return;
                const deltaX = (e.clientX - pointerStartX) / window.innerWidth;
                targetPlayerX = playerStartX + deltaX * 12;
                targetPlayerX = Math.max(-5.5, Math.min(5.5, targetPlayerX));
            });

            window.addEventListener('pointerup', () => { isPointerDown = false; });
            window.addEventListener('pointercancel', () => { isPointerDown = false; });

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keyLeft = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyRight = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keyLeft = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyRight = false;
            });

            document.getElementById('start-btn').addEventListener('click', () => {
                audio.init();
                document.getElementById('start-screen').classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => document.getElementById('start-screen').classList.add('hidden'), 300);
                gameState = 'PLAYING';
            });

            document.getElementById('restart-btn').addEventListener('click', () => {
                document.getElementById('end-modal').classList.add('hidden');
                setupLevel();
                gameState = 'PLAYING';
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            // Particles
            for (let i = particleSystems.length - 1; i >= 0; i--) {
                const ps = particleSystems[i];
                ps.life -= 0.05;
                ps.particles.forEach(p => {
                    p.position.x += p.userData.vx;
                    p.position.y += p.userData.vy;
                    p.position.z += p.userData.vz;
                    p.userData.vy -= 0.015;
                });
                if (ps.life <= 0) {
                    disposeHierarchy(ps.mesh);
                    scene.remove(ps.mesh);
                    particleSystems.splice(i, 1);
                }
            }

            if (gameState === 'PLAYING') {
                if (keyLeft) targetPlayerX -= 0.25;
                if (keyRight) targetPlayerX += 0.25;
                targetPlayerX = Math.max(-5.5, Math.min(5.5, targetPlayerX));

                playerX += (targetPlayerX - playerX) * 0.25;
                playerZ += forwardSpeed;

                const progressPercentage = Math.min(100, (playerZ / levelLength) * 100);
                document.getElementById('progress-bar').style.width = progressPercentage + '%';

                updateCrowdPositions();

                // 1. Gates
                gateEntities.forEach(gate => {
                    if (!gate.passed && playerZ >= gate.z) {
                        gate.passed = true;
                        if (playerX < 0) {
                            applyGateEffect(gate.leftData);
                        } else {
                            applyGateEffect(gate.rightData);
                        }
                    }
                });

                // 2. Obstacles (Tiny Hitboxes)
                const runnersToRemove = new Set();
                obstacleEntities.forEach(obs => {
                    if (obs.type === 'SAW') {
                        obs.mesh.position.x += obs.speed * obs.dir;
                        if (obs.mesh.position.x > 4.0 || obs.mesh.position.x < -4.0) obs.dir *= -1;
                        obs.mesh.children[0].rotation.z += 0.2;

                        if (Math.abs(playerZ - obs.z) < 0.6) {
                            crowdMembers.forEach((m, idx) => {
                                if (Math.abs(m.mesh.position.x - obs.mesh.position.x) < 0.7) {
                                    runnersToRemove.add(idx);
                                }
                            });
                        }
                    }
                });

                if (runnersToRemove.size > 0) {
                    const sortedIndices = Array.from(runnersToRemove).sort((a, b) => b - a);
                    sortedIndices.forEach(idx => {
                        if (idx < crowdMembers.length) {
                            const removed = crowdMembers.splice(idx, 1)[0];
                            spawnPopParticles(removed.mesh.position, 0x0284c7);
                            disposeHierarchy(removed.mesh);
                            scene.remove(removed.mesh);
                            audio.playPop();
                        }
                    });
                }

                // 3. Enemy Clashes (You wipe them out!)
                enemyGroups.forEach(eg => {
                    if (eg.active) {
                        if (Math.abs(playerZ - eg.group.position.z) < 1.6) {
                            while (eg.members.length > 0 && crowdMembers.length > 1) {
                                const pRunner = crowdMembers.pop();
                                const eRunner = eg.members.pop();

                                spawnPopParticles(pRunner.mesh.position, 0x0284c7);
                                spawnPopParticles(eRunner.mesh.position, 0xe11d48);

                                disposeHierarchy(pRunner.mesh);
                                disposeHierarchy(eRunner.mesh);
                                scene.remove(pRunner.mesh);
                                eg.group.remove(eRunner.mesh);

                                audio.playPop();
                            }
                            eg.active = false;
                        }
                    }
                });

                // 4. Reach Finish Line
                if (playerZ >= levelLength) {
                    gameState = 'FINISH_RUN';
                    audio.playWin();
                }

                const crowdRadius = Math.min(4.0, Math.sqrt(crowdMembers.length) * 0.4);
                camera.position.x = playerX * 0.4;
                camera.position.z = playerZ - 13 - crowdRadius;
                camera.position.y = 9 + crowdRadius * 0.5;
                camera.lookAt(playerX * 0.2, 1.5, playerZ + 5);

            } else if (gameState === 'FINISH_RUN') {
                finishClimbTimer += 0.03;
                playerZ += forwardSpeed * 0.8;

                const stairIndex = Math.min(9, Math.floor((playerZ - levelLength) / 3.5));
                highestStairReached = stairIndex + 1;
                const targetY = (0.8 * highestStairReached);

                crowdMembers.forEach(m => {
                    m.mesh.position.z = playerZ + m.offsetZ;
                    m.mesh.position.y += (targetY - m.mesh.position.y) * 0.2;

                    const ud = m.mesh.userData;
                    ud.leftArm.rotation.x = -Math.PI / 2;
                    ud.rightArm.rotation.x = -Math.PI / 2;
                });

                camera.position.z = playerZ - 14;
                camera.position.y = targetY + 7;
                camera.lookAt(0, targetY + 2, playerZ + 5);

                if (finishClimbTimer > 3.0 || stairIndex >= 9) {
                    triggerGameOver(true);
                }
            }

            renderer.render(scene, camera);
        }

        function triggerGameOver(isWin) {
            if (gameState === 'GAMEOVER') return;
            gameState = 'GAMEOVER';

            const modal = document.getElementById('end-modal');
            const title = document.getElementById('modal-title');
            const sub = document.getElementById('modal-sub');
            const earningsContainer = document.getElementById('earnings-container');

            if (isWin) {
                const remainingRunners = crowdMembers.length;
                const multiplier = highestStairReached;
                const earnedCoins = remainingRunners * multiplier * 10;
                
                totalCoins += earnedCoins;
                document.getElementById('total-coins-display').innerText = totalCoins;

                title.innerText = 'VICTORY!';
                title.className = 'text-4xl font-black text-emerald-400 mb-2';
                sub.innerText = `You dominated Level ${currentLevel}!`;

                document.getElementById('finish-runners-count').innerText = remainingRunners;
                document.getElementById('finish-multiplier').innerText = `${multiplier}x`;
                document.getElementById('earned-coins').innerText = `+${earnedCoins} 🪙`;
                earningsContainer.classList.remove('hidden');

                currentLevel++;
                document.getElementById('level-display').innerText = currentLevel;
            }

            modal.classList.remove('hidden');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = initThree;
    </script>
</body>
